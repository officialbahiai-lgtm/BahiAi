function voiceRenderOverlay_(){
  if(typeof document === 'undefined' || !document.getElementById('voiceOv')) return;
  const st = voiceState_ || voiceNewState_();
  const $ = id => document.getElementById(id);
  $('voStatus').innerHTML = voiceWanted_
    ? `<span class="voice-dot"></span>${t('voice_listening')}`
    : `⏸ ${t('voice_paused')}`;
  $('voLangEn').className = voiceLang_ === 'hi-IN' ? '' : 'on';
  $('voLangHi').className = voiceLang_ === 'hi-IN' ? 'on' : '';
  $('voLive').textContent = voiceInterim_ || '';
  $('voLive').style.display = voiceInterim_ ? 'block' : 'none';
  const mb = $('voMicBtn');
  mb.textContent = voiceWanted_ ? `⏸ ${t('voice_pause')}` : `🎤 ${t('voice_start')}`;
  mb.className = 'voice-mic' + (voiceWanted_ ? ' live' : '');

  const rows = [];
  const cust = voiceTitle_(st.customer), city = voiceTitle_(st.city), brand = voiceTitle_(st.brand);
  rows.push(`<div class="vo-row"><b>${t('customer_name')}:</b> ${cust ? escapeHtml(cust) : '—'}${city ? ' · ' + escapeHtml(city) : ''}</div>`);
  rows.push(`<div class="vo-row"><b>${t('brand_name')}:</b> ${brand ? escapeHtml(brand) : '—'}</div>`);
  draftCart.forEach(d=>{
    rows.push(`<div class="vo-item">${escapeHtml(d.designNumber)}${d.colour ? ' · ' + escapeHtml(d.colour) : ''} — ${d.sizes.map(s=>escapeHtml(s.size) + ' × ' + s.qty + (unitOf_(s)==='set' ? '' : ' ' + unitEn_(unitOf_(s)).toLowerCase())).join(', ')}</div>`);
  });
  if(st.design){
    rows.push(`<div class="vo-item vo-pend">${escapeHtml(st.design)}${st.colours.length ? ' · ' + escapeHtml(st.colours.join(' ')) : ''} — ${escapeHtml(st.sizeTokens.join(' ')) || '…'}${st.qty ? ' × ' + st.qty : ''} …</div>`);
  }
  $('voSummary').innerHTML = rows.join('');
  $('voLog').innerHTML = voiceLog_.map(l=>`<div class="msg ${l.err ? 'err' : ''}" style="margin:6px 0 0;">${escapeHtml(l.msg)}</div>`).join('');
}

/* ---------------- ARTICLE (DISPATCH) SEARCH TAB ---------------- */

function inDispatchDateRange(iso){
  if(!dispatchFromDate && !dispatchToDate) return true;
  if(!iso) return false;
  const key = dispatchDateKey(iso);
  if(dispatchFromDate && key < dispatchFromDate) return false;
  if(dispatchToDate && key > dispatchToDate) return false;
  return true;
}


/* ---------------- BRAND OVERVIEW HELPERS ---------------- */
function normKey_(s){ return String(s==null ? '' : s).trim().replace(/\s+/g,' ').toLowerCase(); }
function natCmp_(a,b){ return String(a==null?'':a).localeCompare(String(b==null?'':b), undefined, {numeric:true, sensitivity:'base'}); }

// Active (not deleted) orders of the brand typed in the Article tab, inside the date range.
function getBrandMatches_(){
  const bql = dispatchBrandQuery.trim().toLowerCase();
  const cql = dispatchCustomerQuery.trim().toLowerCase();
  if(!bql && !cql) return [];
  return bookings.filter(b=>!b.trashed
    && (!bql || (b.brand||'').toLowerCase().includes(bql))
    && (!cql || (b.customerName||'').toLowerCase().includes(cql))
    && inDispatchDateRange(b.orderedAt));
}

// Groups orders as Article > Colour > Size. Colour and size are compared
// ignoring upper/lower case and extra spaces, so "Red", "RED " and "red" from
// different customers all land in ONE combined line instead of repeating.
function buildBrandGroups_(matches){
  const dmap = {};
  matches.forEach(b=>{
    const dk = normKey_(b.designNumber);
    const d = dmap[dk] || (dmap[dk] = { design: String(b.designNumber).trim(), colours: {} });
    const ck = normKey_(b.colour);
    const c = d.colours[ck] || (d.colours[ck] = { colour: String(b.colour||'').trim().toUpperCase(), sizes: {} });
    const sk = normKey_(b.size) + '|' + unitOf_(b);
    const s = c.sizes[sk] || (c.sizes[sk] = { size: String(b.size||'-').trim(), unit: unitOf_(b), pending: 0, dispatched: 0, lines: [] });
    s[b.status==='dispatched' ? 'dispatched' : 'pending'] += b.qty;
    s.lines.push(b);
  });
  return Object.values(dmap)
    .sort((a,b)=> natCmp_(a.design,b.design))
    .map(d=>({
      design: d.design,
      colours: Object.values(d.colours)
        .sort((a,b)=> natCmp_(a.colour,b.colour))
        .map(c=>({ colour: c.colour, sizes: Object.values(c.sizes).sort((a,b)=> natCmp_(a.size,b.size) || UNIT_KEYS.indexOf(a.unit)-UNIT_KEYS.indexOf(b.unit)) }))
    }));
}

// Keeps only sets still waiting to be dispatched; drops sizes/colours/articles
// that have nothing pending left.
function pendingOnlyGroups_(groups){
  return groups.map(g=>({
    design: g.design,
    colours: g.colours.map(c=>({ colour: c.colour, sizes: c.sizes.filter(s=>s.pending > 0) })).filter(c=>c.sizes.length)
  })).filter(g=>g.colours.length);
}


// "Only Customer-wise": every customer with ALL of their still-pending lines
// (design + colour + size + sets). Identical lines of one customer are merged.
function buildCustomerPendingGroups_(matches){
  const map = {};
  matches.forEach(b=>{
    if(b.status === 'dispatched' || b.trashed) return;
    const ck = normKey_(b.customerName);
    const c = map[ck] || (map[ck] = { customer: String(b.customerName||'').trim(), total: 0, items: [], lines: {} });
    const lk = normKey_(b.designNumber) + '|' + normKey_(b.colour) + '|' + normKey_(b.size) + '|' + unitOf_(b);
    const l = c.lines[lk] || (c.lines[lk] = { design: String(b.designNumber).trim(), colour: String(b.colour||'').trim().toUpperCase(), size: String(b.size||'-').trim(), unit: unitOf_(b), qty: 0 });
    l.qty += b.qty; c.total += b.qty; c.items.push({ qty: b.qty, unit: unitOf_(b) });
  });
  return Object.values(map)
    .sort((a,b)=> String(a.customer).localeCompare(String(b.customer)))
    .map(c=>({
      customer: c.customer, total: c.total, items: c.items,
      lines: Object.values(c.lines).sort((a,b)=> natCmp_(a.design,b.design) || natCmp_(a.colour,b.colour) || natCmp_(a.size,b.size))
    }));
}

function brandActionsCard_(countLine){
  const sel = v => dispatchBrandView===v ? 'background:var(--navy);color:#fff;' : '';
  return `
        <div class="card">
          <div class="section-label" style="margin-top:0;">${t('brand_overview')}: ${[dispatchBrandQuery.trim(), dispatchCustomerQuery.trim()].filter(Boolean).map(escapeHtml).join(' · ')}</div>
          <div style="font-size:13px;color:#5b6472;margin-bottom:10px;">${countLine}</div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;">
            <button class="secondary" style="${sel('summary')}" onclick="setDispatchBrandView('summary')">Size-wise Total</button>
            <button class="secondary" style="${sel('detail')}" onclick="setDispatchBrandView('detail')">Customer-wise Detail</button>
            <button class="secondary" style="${sel('customer')}" onclick="setDispatchBrandView('customer')">Only Customer-wise</button>
          </div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <button class="secondary" onclick="printBrandOverview()">${t('print')} PDF</button>
            <button class="secondary" onclick="downloadBrandExcel()">Download Excel</button>
          </div>
        </div>`;
}

function renderDispatch(main){
  const activeBookings = bookings.filter(b=>!b.trashed);
  // Include designs that only exist in deleted orders too, so searching an
  // article whose every order was deleted still shows who had ordered it.
  const allDesigns = [...new Set(bookings.map(b=>b.designNumber))];

  let resultsHtml = '';
  let exactDesign = null;
  const hasArticleQuery = !!dispatchQuery.trim();
  const hasBrandQuery = !!dispatchBrandQuery.trim();
  const hasCustQuery = !!dispatchCustomerQuery.trim();
  const custQl = dispatchCustomerQuery.trim().toLowerCase();

  if(selectedDesign){
    // A design was explicitly picked from the selection list (or matched itself
    // exactly) — always resolve to exactly this design, even if its digits
    // happen to also appear inside a longer design number like "118 NAVY PURPLE".
    exactDesign = selectedDesign;
  } else if(hasArticleQuery){
    const q = dispatchQuery.trim().toLowerCase();
    const matchingDesigns = allDesigns.filter(d=>d.toLowerCase().includes(q));
    if(!matchingDesigns.length){
      resultsHtml = `<div class="empty">${t('no_article_found')}</div>`;
    } else if(matchingDesigns.length > 1){
      resultsHtml = `<div class="card">
        <div class="section-label" style="margin-top:0;">${t('matching_articles')}</div>
        ${matchingDesigns.map(d=>`<button class="secondary" style="margin-top:8px;text-align:left;" onclick="pickDesign('${d.replace(/'/g,"\\'")}')">${escapeHtml(d)}</button>`).join('')}
      </div>`;
    } else {
      exactDesign = matchingDesigns[0];
    }
  }

  if(exactDesign){
    let matches = activeBookings.filter(b=>b.designNumber===exactDesign && inDispatchDateRange(b.orderedAt));
    if(hasBrandQuery){
      const bq = dispatchBrandQuery.trim().toLowerCase();
      matches = matches.filter(b=>(b.brand||'').toLowerCase().includes(bq));
    }
    if(hasCustQuery){
      matches = matches.filter(b=>(b.customerName||'').toLowerCase().includes(custQl));
    }
    const pendingQty = totalsShort_(matches.filter(b=>b.status==='pending'));
    const doneQty = totalsShort_(matches.filter(b=>b.status==='dispatched'));

    const customers = [...new Set(matches.map(b=>b.customerName))];
    const custCards = customers.length ? customers.map(cname=>{
      const rows = matches.filter(b=>b.customerName===cname);
      const allDone = rows.every(b=>b.status==='dispatched');

      // Small order-date label next to the customer's name — if they ordered
      // this article on more than one date, show each date once.
      const orderDates = [...new Set(rows.map(b=>dispatchDateKey(b.orderedAt)))]
        .sort((a,b)=>b.localeCompare(a))
        .map(dk=>dispatchDateLabel(dk));

      // group this customer's rows by colour + brand together, since the same
      // customer (or different customers) can order the same article under
      // different brands and/or colours — staff need to see exactly which
      // sizes belong to which brand+colour combo, not just a flat list
      const groups = {};
      rows.forEach(b=>{
        const key = (b.colour||'') + '||' + (b.brand||'');
        if(!groups[key]) groups[key] = [];
        groups[key].push(b);
      });
      const groupKeys = Object.keys(groups);
      const showGroupLabels = groupKeys.length > 1 || (groupKeys.length===1 && groupKeys[0] !== '||');

      const groupsHtml = groupKeys.map(key=>{
        const [colour, brand] = key.split('||');
        const chips = groups[key].map(b=>{
          const done = b.status==='dispatched';
          return `<button class="size-btn ${done?'done':''}" ${done?'disabled':''} onclick="dispatchOne('${b.id}')">${escapeHtml(b.size)} · ${qtyShort_(b)}${done?' ✓':''}</button>`;
        }).join('');
        let labelText = '';
        if(colour && brand) labelText = `${colour} · ${brand}`;
        else if(colour) labelText = colour;
        else if(brand) labelText = brand;
        else labelText = t('no_colour_brand');
        const label = showGroupLabels ? `<div class="colour-label">${escapeHtml(labelText)}</div>` : '';
        return `${label}<div>${chips}</div>`;
      }).join('');

      return `<div class="cust-card${allDone ? ' all-done' : ''}">
        <div class="cust-head"><span class="name">${escapeHtml(cname)} <span style="font-size:11.5px;font-weight:500;color:#8a93a0;margin-left:6px;">${orderDates.map(escapeHtml).join(', ')}</span></span>${allDone ? `<span class="set-pill done">${t('fully_dispatched')}</span>` : ''}</div>
        ${groupsHtml}
      </div>`;
    }).join('') : '';

    // Parties whose order for this article was moved to Deleted — shown
    // greyed out (like a fully-dispatched card) with their actual size/qty
    // details still visible, just non-clickable. Shown even if the same
    // customer also has a separate active order for this article on a
    // different date — the deleted one still appears as its own blurred card.
    const trashedMatches = bookings.filter(b=>b.trashed && b.designNumber===exactDesign &&
      (!hasBrandQuery || (b.brand||'').toLowerCase().includes(dispatchBrandQuery.trim().toLowerCase())) &&
      (!hasCustQuery || (b.customerName||'').toLowerCase().includes(custQl)));
    const trashedCustomerNames = [...new Set(trashedMatches.map(b=>b.customerName))];
    const trashedCardsHtml = trashedCustomerNames.map(cname=>{
      const rows = trashedMatches.filter(b=>b.customerName===cname);
      const orderDates = [...new Set(rows.map(b=>dispatchDateKey(b.orderedAt)))]
        .sort((a,b)=>b.localeCompare(a))
        .map(dk=>dispatchDateLabel(dk));

      const groups = {};
      rows.forEach(b=>{
        const key = (b.colour||'') + '||' + (b.brand||'');
        if(!groups[key]) groups[key] = [];
        groups[key].push(b);
      });
      const groupKeys = Object.keys(groups);
      const showGroupLabels = groupKeys.length > 1 || (groupKeys.length===1 && groupKeys[0] !== '||');
      const groupsHtml = groupKeys.map(key=>{
        const [colour, brand] = key.split('||');
        const chips = groups[key].map(b=>`<span class="size-btn done">${escapeHtml(b.size)} · ${qtyShort_(b)}</span>`).join('');
        let labelText = '';
        if(colour && brand) labelText = `${colour} · ${brand}`;
        else if(colour) labelText = colour;
        else if(brand) labelText = brand;
        else labelText = t('no_colour_brand');
        const label = showGroupLabels ? `<div class="colour-label">${escapeHtml(labelText)}</div>` : '';
        return `${label}<div>${chips}</div>`;
      }).join('');

      return `
      <div class="cust-card" style="opacity:0.45;filter:grayscale(65%);pointer-events:none;user-select:none;">
        <div class="cust-head"><span class="name">${escapeHtml(cname)} <span style="font-size:11.5px;font-weight:500;color:#8a93a0;margin-left:6px;">${orderDates.map(escapeHtml).join(', ')}</span></span><span class="set-pill" style="background:#e2e2e2;color:#777;">${t('nav_deleted')}</span></div>
        ${groupsHtml}
      </div>`;
    }).join('');

    const noActiveMsg = (!customers.length && !trashedCustomerNames.length) ? `<div class="empty">${t('no_article_found')}</div>` : '';
    const allColours = [...new Set(matches.map(b=>b.colour).filter(Boolean))];
    const allBrands = [...new Set(matches.map(b=>b.brand).filter(Boolean))];
    resultsHtml = `
      <div class="card">
        <div class="section-label" style="margin-top:0;">${t('article')}: ${escapeHtml(exactDesign)}
          ${selectedDesign ? `<button class="chip x" style="border:none;background:none;color:var(--navy);font-weight:700;float:right;" onclick="clearDesignSelection()">✕ ${t('change')}</button>` : ''}
        </div>
        ${allColours.length ? `<div style="font-size:13px;color:#5b6472;margin-bottom:4px;">${t('colours_ordered')}: ${allColours.map(escapeHtml).join(', ')}</div>` : ''}
        ${allBrands.length ? `<div style="font-size:13px;color:#5b6472;margin-bottom:8px;">${t('brands_ordered')}: ${allBrands.map(escapeHtml).join(', ')}</div>` : ''}
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <span class="set-pill pending">${t('closing_set')}: ${pendingQty} ${t('badge_pending')}</span>
          <span class="set-pill done">${t('dispatched')}: ${doneQty}</span>
        </div>
      </div>
      ${custCards}
      ${noActiveMsg}
      ${trashedCardsHtml}
    `;
  } else if(!hasArticleQuery && (hasBrandQuery || hasCustQuery)){
    // Brand overview. "Size-wise Total" shows ONLY what is still pending
    // (dispatched sets are already subtracted), with same colour / same size
    // from different customers merged into one combined total.
    // "Customer-wise Detail" shows who it belongs to and whether it is
    // dispatched or still pending.
    const brandMatches = getBrandMatches_();
    const allGroups = buildBrandGroups_(brandMatches);
    const isDetail = dispatchBrandView === 'detail';
    const groups = isDetail ? allGroups : pendingOnlyGroups_(allGroups);

    if(!brandMatches.length){
      resultsHtml = `<div class="empty">${t('no_brand_orders')}</div>`;
    } else if(dispatchBrandView === 'customer'){
      const custGroups = buildCustomerPendingGroups_(brandMatches);
      if(!custGroups.length){
        resultsHtml = `<div class="empty">${t('no_pending_brand')}</div>`;
      } else {
        const totAll = totalsUi_(custGroups.flatMap(c=>c.items));
        const custCards = custGroups.map(c=>`<div class="cust-card">
          <div class="cust-head"><span class="name">${escapeHtml(c.customer)}</span><span><span class="set-pill pending">${totalsUi_(c.items)}</span></span></div>
          ${c.lines.map(l=>`<div class="item-line"><span>${escapeHtml(l.design)}${l.colour ? ' · ' + escapeHtml(l.colour) : ''} · ${escapeHtml(l.size)}</span><span>${l.qty} ${unitUi_(l.unit)}</span></div>`).join('')}
        </div>`).join('');
        resultsHtml = brandActionsCard_(`${custGroups.length} ${t('nav_customers')} · ${totAll} (${t('badge_pending')})`) + custCards;
      }
    } else if(!groups.length){
      resultsHtml = `<div class="empty">${t('no_pending_brand')}</div>`;
    } else {
      const totPendItems = [], totDoneItems = [];
      const articleCards = groups.map(g=>{
        const gPendItems = [], gDoneItems = [];
        g.colours.forEach(c=>c.sizes.forEach(s=>{
          if(s.pending) gPendItems.push({ qty: s.pending, unit: s.unit });
          if(s.dispatched) gDoneItems.push({ qty: s.dispatched, unit: s.unit });
        }));
        totPendItems.push(...gPendItems); totDoneItems.push(...gDoneItems);
        const showColourLabels = g.colours.length > 1 || (g.colours.length===1 && g.colours[0].colour !== '');

        const colourSections = g.colours.map(c=>{
          let lines = '';
          if(isDetail){
            const flat = [];
            c.sizes.forEach(s=> s.lines.forEach(b=> flat.push(b)));
            flat.sort((a,b)=> natCmp_(a.size,b.size) || (a.status===b.status?0:(a.status==='pending'?-1:1)) || String(a.customerName).localeCompare(String(b.customerName)));
            lines = flat.map(b=>{
              const done = b.status==='dispatched';
              return `<div class="item-line"><span>${escapeHtml(b.customerName)} · ${escapeHtml(b.size)}</span><span>${qtyUi_(b)} · <span class="${done?'st-done':'st-pend'}">${done ? t('dispatched')+' ✓' : t('badge_pending')}</span></span></div>`;
            }).join('');
          } else {
            lines = c.sizes.map(s=>`<div class="item-line"><span>${escapeHtml(s.size)}</span><span>${s.pending} ${unitUi_(s.unit)}</span></div>`).join('');
          }
          const label = showColourLabels ? `<div class="colour-label">${escapeHtml(c.colour || t('no_colour'))}</div>` : '';
          return `${label}${lines}`;
        }).join('');

        const pills = `<span class="set-pill pending">${totalsUi_(gPendItems)}</span>` + (isDetail && gDoneItems.length ? ` <span class="set-pill done">${t('dispatched')}: ${totalsShort_(gDoneItems)}</span>` : '');
        return `<div class="cust-card">
          <div class="cust-head"><span class="name">${t('article')}: ${escapeHtml(g.design)}</span><span>${pills}</span></div>
          ${colourSections}
        </div>`;
      }).join('');

      const countLine = isDetail
        ? `${groups.length} ${t('articles_word')} · ${t('badge_pending')}: ${totalsShort_(totPendItems)} · ${t('dispatched')}: ${totalsShort_(totDoneItems)}`
        : `${groups.length} ${t('articles_word')} · ${totalsUi_(totPendItems)} (${t('badge_pending')})`;

      resultsHtml = brandActionsCard_(countLine) + articleCards;
    }
  }

  main.innerHTML = `
    <div class="card">
      <h2>${t('search_by_article')}</h2>
      <input id="dispatchSearch" list="designList" placeholder="${t('article_ph')}" value="${escapeHtml(dispatchQuery)}" oninput="onDispatchSearch(this.value)" autofocus>
      <label style="margin-top:10px;">${t('by_customer_name')} (${t('optional_word')})</label>
      <input id="dispatchCustomerSearch" list="customerList" placeholder="${t('cust_ph_optional')}" value="${escapeHtml(dispatchCustomerQuery)}" oninput="onDispatchCustomerSearch(this.value)">
      <label style="margin-top:10px;">${t('by_brand_name')} (${t('optional_word')})</label>
      <input id="dispatchBrandSearch" list="brandList" placeholder="${t('brand_ph_optional')}" value="${escapeHtml(dispatchBrandQuery)}" oninput="onDispatchBrandSearch(this.value)">
      <label style="margin-top:10px;">${t('from_date')} (${t('optional_word')})</label>
      <input id="dispatchFromDate" type="date" value="${escapeHtml(dispatchFromDate)}" oninput="onDispatchDateRange('from', this.value)">
      <label style="margin-top:10px;">${t('to_date')} (${t('optional_word')})</label>
      <input id="dispatchToDate" type="date" value="${escapeHtml(dispatchToDate)}" oninput="onDispatchDateRange('to', this.value)">
    </div>
    <div id="dispatchResults">${resultsHtml}</div>
  `;
}

// Rebuilds only the results area below the search boxes, leaving the text
// box the person is typing in completely untouched — that is what stops the
// mobile keyboard from hiding/reappearing on every digit typed.
function refreshDispatchResultsOnly_(){
  const live = document.getElementById('dispatchResults');
  if(!live){ render(); return; }
  const tmp = document.createElement('div');
  renderDispatch(tmp);
  const fresh = tmp.querySelector('#dispatchResults');
  if(fresh) live.innerHTML = fresh.innerHTML; else render();
}

function setDispatchBrandView(view){
  dispatchBrandView = view;
  render();
}

function onDispatchDateRange(which, val){
  if(which==='from') dispatchFromDate = val; else dispatchToDate = val;
  render();
}

function printBrandOverview(){
  const bq = dispatchBrandQuery.trim() || dispatchCustomerQuery.trim();
  if(!bq) return;
  const matches = getBrandMatches_();
  if(!matches.length){ alert(t('no_brand_orders')); return; }

  const brandNames = [...new Set(matches.map(b=>String(b.brand||'').trim()).filter(Boolean))];
  const brandLabel0 = brandNames.length === 1 ? brandNames[0] : (dispatchBrandQuery.trim() || 'All Brands');
  // When a customer name is typed too, the PDF title carries it as well, so the
  // printed / WhatsApp report clearly shows whose order it is.
  const custNamesPrint = [...new Set(matches.map(b=>String(b.customerName||'').trim()))];
  const brandLabel = dispatchCustomerQuery.trim()
    ? ((custNamesPrint.length === 1 ? custNamesPrint[0] : dispatchCustomerQuery.trim()) + ' - ' + brandLabel0)
    : brandLabel0;
  const todayTxt = new Date().toLocaleDateString('en-IN');

  // ONLY CUSTOMER-WISE view -> each customer with all their pending lines.
  if(dispatchBrandView === 'customer'){
    const custGroups = buildCustomerPendingGroups_(matches);
    if(!custGroups.length){ alert(t('no_pending_brand')); return; }
    const hdrC = unitHdr_(custGroups.flatMap(c=>c.lines));
    const bl = brandLabel;
    const rowsC = [], labelsC = [], headsC = []; let totC = 0;
    const headStyleC = { fillColor:[222,234,250], textColor:[22,86,166], fontStyle:'bold', fontSize:12 };
    custGroups.forEach(c=>{
      totC += c.total;
      rowsC.push([{ content: `${c.customer}      (${totalsPdf_(c.items)})`, colSpan: 4, styles: headStyleC }]);
      labelsC.push(c.customer); headsC.push(true);
      c.lines.forEach(l=>{
        rowsC.push([ l.design, l.colour || '-', l.size, { content: qtyCell_(l, hdrC), styles:{ fontStyle:'bold', halign:'center' } } ]);
        labelsC.push(c.customer); headsC.push(false);
      });
    });
    let dateNoteC = '';
    if(dispatchFromDate || dispatchToDate){
      dateNoteC = ` | ${dispatchFromDate ? dispatchDateLabel(dispatchFromDate) : '...'} - ${dispatchToDate ? dispatchDateLabel(dispatchToDate) : '...'}`;
    }
    const blobC = buildPdfBlob(`Order to - ${bl}`, `Date : ${todayTxt}${dateNoteC}`,
      ['Article','Colour','Size',`Pending ${hdrC}`], rowsC, `Total Pending: ${totalsPdf_(custGroups.flatMap(c=>c.items))}`,
      { styles:{ fontSize:11, cellPadding:3.2 }, columnStyles:{ 3:{ halign:'center', cellWidth:35 } },
        heading: 'Customer-Wise Details',
        continuation: { labels: labelsC, isHeading: headsC,
          makeRow: (label)=>[{ content: `${label}      (continued)`, colSpan: 4, styles: headStyleC }] } });
    if(!blobC){ alert(t('pdf_gen_fail')); return; }
    showPdfActions_(blobC, `Customer-wise-Pending-${bl.replace(/[^a-z0-9]/gi,'_')}.pdf`, `Order to - ${bl}`, `*Order to - ${bl}*`);
    return;
  }

  // CUSTOMER-WISE DETAIL view -> the original customer-wise PDF (each customer's
  // lines, with Pending / Dispatched status), same as before.
  if(dispatchBrandView === 'detail'){
    const sorted = matches.slice().sort((a,b)=> a.designNumber.localeCompare(b.designNumber) || (a.colour||'').localeCompare(b.colour||'') || a.customerName.localeCompare(b.customerName));
    const hasPriceD = sorted.some(b=>b.pricePerPcs);
    const hdrD = unitHdr_(sorted);
    const colsD = ['Article','Colour','Customer','Order Date','Size'];
    if(hasPriceD) colsD.push('Price (Rs)');
    colsD.push(`Pending ${hdrD}`,`Dispatched ${hdrD}`);
    const rowsD = sorted.map(b=>{
      const done = b.status==='dispatched';
      const r = [b.designNumber, b.colour||'-', b.customerName, dispatchDateLabel(dispatchDateKey(b.orderedAt)), b.size];
      if(hasPriceD) r.push(b.pricePerPcs ? String(b.pricePerPcs) : '-');
      r.push(done ? '' : qtyCell_(b, hdrD), done ? qtyCell_(b, hdrD) : '');
      return r;
    });
    const ppD = { columns: colsD, tableRows: rowsD };
    const setColStart = colsD.length - 2;
    const colStylesD = {}; colStylesD[setColStart] = { halign:'center' }; colStylesD[setColStart+1] = { halign:'center' };
    let dateNoteD = '';
    if(dispatchFromDate || dispatchToDate){
      dateNoteD = ` | ${dispatchFromDate ? dispatchDateLabel(dispatchFromDate) : '…'} - ${dispatchToDate ? dispatchDateLabel(dispatchToDate) : '…'}`;
    }
    const titleD = `Order to - ${brandLabel}`;
    const blobD = buildPdfBlob(titleD, `Date : ${todayTxt}${dateNoteD}`, ppD.columns, ppD.tableRows, `Pending: ${totalsPdf_(sorted.filter(b=>b.status!=='dispatched'))}   |   Dispatched: ${totalsPdf_(sorted.filter(b=>b.status==='dispatched'))}   |   ${t('total')}: ${totalsPdf_(sorted)}`, { columnStyles: colStylesD, heading: 'Article-Wise Details' });
    if(!blobD){ alert(t('pdf_gen_fail')); return; }
    showPdfActions_(blobD, `Brand-Customerwise-${bq.replace(/[^a-z0-9]/gi,'_')}.pdf`, titleD, `*${titleD}*`);
    return;
  }

  // SIZE-WISE TOTAL view -> set-wise PENDING list (what still has to be ordered/arranged).
  const groups = pendingOnlyGroups_(buildBrandGroups_(matches));
  if(!groups.length){ alert(t('no_pending_brand')); return; }

  // Table: Article | Colour | Size | Pending Set ("N Set").
  // The article number is written once on its first row; the rows below it show "=" (same
  // article) until that article's rows end. A row that starts a new page shows the number again.
  const rows = [], rowArticle = [], rowFirst = [];
  const totalItems = [];
  groups.forEach(g=>g.colours.forEach(c=>c.sizes.forEach(s=>totalItems.push({ qty: s.pending, unit: s.unit }))));
  const hdrS = unitHdr_(totalItems);
  let total = 0, artIdx = 0;
  groups.forEach(g=>{
    const light = (artIdx++ % 2 === 1);                  // alternate articles get a light tint
    let first = true;
    g.colours.forEach(c=>c.sizes.forEach(s=>{
      total += s.pending;
      const fill = light ? { fillColor:[238,243,251] } : {};
      rows.push([
        { content: first ? g.design : '=', styles: Object.assign({ fontStyle: first ? 'bold' : 'normal', halign: first ? 'left' : 'center' }, fill) },
        { content: c.colour || '-', styles: fill },
        { content: s.size, styles: fill },
        { content: `${s.pending} ${unitEn_(s.unit)}`, styles: Object.assign({ fontStyle:'bold', halign:'center' }, fill) }
      ]);
      rowArticle.push(g.design); rowFirst.push(first);
      first = false;
    }));
  });

  let dateNote = '';
  if(dispatchFromDate || dispatchToDate){
    dateNote = ` | ${dispatchFromDate ? dispatchDateLabel(dispatchFromDate) : '...'} - ${dispatchToDate ? dispatchDateLabel(dispatchToDate) : '...'}`;
  }
  // Brand name exactly as saved on the orders (e.g. "Spring kids"), if all matches share one spelling
  const blob = buildPdfBlob(
    `Order to - ${brandLabel}`,
    `Date : ${todayTxt}${dateNote}`,
    ['Article','Colour','Size', hdrS==='Qty' ? 'Pending Qty' : `Pending ${hdrS}`],
    rows,
    `Total Pending: ${totalsPdf_(totalItems)}`,
    { styles:{ fontSize:11, cellPadding:3.2 }, columnStyles:{ 0:{ cellWidth:42 }, 3:{ halign:'center', cellWidth:35 } }, heading: 'Size Set-wise Details',
      repeatLabel: { articles: rowArticle, isFirst: rowFirst, col: 0 } }
  );
  if(!blob){ alert(t('pdf_gen_fail')); return; }
  showPdfActions_(blob, `Order-to-${brandLabel.replace(/[^a-z0-9]/gi,'_')}.pdf`, `Order to - ${brandLabel}`, `*Order to - ${brandLabel}*`);
}

function downloadBrandExcel(){
  const bq = dispatchBrandQuery.trim() || dispatchCustomerQuery.trim();
  if(!bq) return;
  if(!window.XLSX){ alert(t('pdf_gen_fail')); return; }
  const matches = getBrandMatches_();
  if(!matches.length){ alert(t('no_brand_orders')); return; }
  // ONLY CUSTOMER-WISE view -> every customer with all their pending lines.
  if(dispatchBrandView === 'customer'){
    const custGroups = buildCustomerPendingGroups_(matches);
    if(!custGroups.length){ alert(t('no_pending_brand')); return; }
    const hdrXC = unitHdr_(custGroups.flatMap(c=>c.lines));
    const cData = [['Customer','Article','Colour','Size', xlHdr_('Pending', hdrXC)]];
    custGroups.forEach(c=>c.lines.forEach(l=>{ cData.push([c.customer, l.design, l.colour || '-', l.size, xlQty_(l, hdrXC)]); }));
    cData.push([]);
    cData.push(['TOTAL','','','', xlTotal_(custGroups.flatMap(c=>c.items))]);
    const wsC = XLSX.utils.aoa_to_sheet(cData);
    wsC['!cols'] = [{wch:28},{wch:14},{wch:16},{wch:12},{wch:14}];
    const wbC = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wbC, wsC, 'Customer-wise Pending');
    XLSX.writeFile(wbC, `Customer-wise-Pending-${bq.replace(/[^a-z0-9]/gi,'_')}.xlsx`);
    return;
  }

  // CUSTOMER-WISE DETAIL view -> same lines as the customer-wise PDF, with
  // Pending Sets and Dispatched Sets in two separate columns.
  if(dispatchBrandView === 'detail'){
    const sorted = matches.slice().sort((a,b)=> natCmp_(a.designNumber,b.designNumber) || natCmp_(a.colour||'',b.colour||'') || String(a.customerName).localeCompare(String(b.customerName)) || natCmp_(a.size,b.size));
    const hasPrice = sorted.some(b=>b.pricePerPcs);
    const head = ['Article','Colour','Customer','Order Date','Size'];
    if(hasPrice) head.push('Price (Rs)');
    const hdrXD = unitHdr_(sorted);
    head.push(xlHdr_('Pending', hdrXD), xlHdr_('Dispatched', hdrXD));
    const dData = [head];
    sorted.forEach(b=>{
      const done = b.status==='dispatched';
      const row = [b.designNumber, b.colour||'-', b.customerName, dispatchDateLabel(dispatchDateKey(b.orderedAt)), b.size];
      if(hasPrice) row.push(b.pricePerPcs ? Number(b.pricePerPcs) || String(b.pricePerPcs) : '-');
      row.push(done ? '' : xlQty_(b, hdrXD), done ? xlQty_(b, hdrXD) : '');
      dData.push(row);
    });
    dData.push([]);
    const tot = ['TOTAL','','','',''];
    if(hasPrice) tot.push('');
    tot.push(xlTotal_(sorted.filter(b=>b.status!=='dispatched')), xlTotal_(sorted.filter(b=>b.status==='dispatched')));
    dData.push(tot);
    const wsD = XLSX.utils.aoa_to_sheet(dData);
    const cols = [{wch:14},{wch:16},{wch:26},{wch:14},{wch:12}];
    if(hasPrice) cols.push({wch:11});
    cols.push({wch:14},{wch:16});
    wsD['!cols'] = cols;
    const wbD = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wbD, wsD, 'Customer-wise');
    XLSX.writeFile(wbD, `Brand-Customerwise-${bq.replace(/[^a-z0-9]/gi,'_')}.xlsx`);
    return;
  }

  const all = buildBrandGroups_(matches);
  const pend = pendingOnlyGroups_(all);
  if(!pend.length){ alert(t('no_pending_brand')); return; }

  // Sheet 1: only what is still PENDING (what has to be ordered), one clean
  // line per Article + Colour + Size, customers already combined.
  const pItemsX = [];
  pend.forEach(g=>g.colours.forEach(c=>c.sizes.forEach(s=>pItemsX.push({ qty: s.pending, unit: s.unit }))));
  const hdrXP = unitHdr_(pItemsX);
  const pData = [['Article','Colour','Size', xlHdr_('Pending', hdrXP)]];
  pend.forEach(g=>g.colours.forEach(c=>c.sizes.forEach(s=>{
    pData.push([g.design, c.colour || '-', s.size, xlQty_({ qty: s.pending, unit: s.unit }, hdrXP)]);
  })));
  pData.push([]);
  pData.push(['TOTAL', '', '', xlTotal_(pItemsX)]);
  const ws = XLSX.utils.aoa_to_sheet(pData);
  ws['!cols'] = [{wch:14},{wch:16},{wch:12},{wch:14}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Pending');

  // Sheet 2 (only if something was dispatched): kept separate, so pending and
  // dispatched never get mixed in the same columns.
  const dItemsX = [];
  all.forEach(g=>g.colours.forEach(c=>c.sizes.forEach(s=>{ if(s.dispatched > 0) dItemsX.push({ qty: s.dispatched, unit: s.unit }); })));
  const hdrXDs = unitHdr_(dItemsX);
  const dData = [['Article','Colour','Size', xlHdr_('Dispatched', hdrXDs)]];
  all.forEach(g=>g.colours.forEach(c=>c.sizes.forEach(s=>{
    if(s.dispatched > 0){ dData.push([g.design, c.colour || '-', s.size, xlQty_({ qty: s.dispatched, unit: s.unit }, hdrXDs)]); }
  })));
  if(dData.length > 1){
    dData.push([]);
    dData.push(['TOTAL', '', '', xlTotal_(dItemsX)]);
    const ws2 = XLSX.utils.aoa_to_sheet(dData);
    ws2['!cols'] = [{wch:14},{wch:16},{wch:12},{wch:16}];
    XLSX.utils.book_append_sheet(wb, ws2, 'Dispatched');
  }
  XLSX.writeFile(wb, `Order-to-${bq.replace(/[^a-z0-9]/gi,'_')}.xlsx`);
}

async function dispatchOne(bookingId){
  const b = bookings.find(x=>x.id===bookingId);
  if(!b || b.status==='dispatched') return;
  markBusy(t('processing_word'));
  b.status = 'dispatched';
  b.dispatchedAt = new Date().toISOString();
  b.dispatchedBy = currentStaff ? { name: currentStaff.name, mobile: currentStaff.mobile } : null;
  await saveData();
  await logActivity('Item Dispatched', `${b.customerName} — Design ${b.designNumber}, ${b.size} × ${b.qty}`);
  render();
}

// Dispatches every pending item in one customer's whole Pending-tab group
// (i.e. one date group) in a single tap, straight from the Pending tab.
// It's the exact same status flip as dispatchOne, just applied to every
// row in that group — so it shows up correctly (blurred/✓) the moment
// someone searches for it in the Article tab or opens the Dispatched tab.
async function dispatchGroupDated(cname, dk){
  const now = new Date().toISOString();
  const dispatchedBy = currentStaff ? { name: currentStaff.name, mobile: currentStaff.mobile } : null;
  const rows = bookings.filter(b=>b.customerName===cname && b.status==='pending' && !b.trashed && dispatchDateKey(b.orderedAt)===dk && pdBrandOk_(b));
  if(!rows.length) return;
  let total = 0;
  rows.forEach(b=>{
    b.status = 'dispatched';
    b.dispatchedAt = now;
    b.dispatchedBy = dispatchedBy;
    total += b.qty;
  });
  await saveData();
  await logActivity('Order Dispatched', `${cname} — ${dispatchDateLabel(dk)} — ${total} sets`);
  render();
}

/* ---------------- DISPATCHED ORDERS TAB ---------------- */

function dispatchDateKey(iso){
  const d = new Date(iso);
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
// Text for the date line under the customer name in order PDFs (the order's own date, or a range).
function pdfOrderDateText_(rows){
  const ks = [...new Set((rows || []).map(b=>b.orderedAt).filter(Boolean).map(dispatchDateKey))].sort();
  if(!ks.length) return dispatchDateLabel(dispatchDateKey(new Date().toISOString()));
  return ks.length === 1 ? dispatchDateLabel(ks[0]) : dispatchDateLabel(ks[0]) + ' to ' + dispatchDateLabel(ks[ks.length - 1]);
}
function dispatchDateLabel(key){
  const [y,m,d] = key.split('-').map(Number);
  return new Date(y, m-1, d).toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric' });
}

function renderDispatchedOrders(main){
  let dispatchedAll = bookings.filter(b=>b.status==='dispatched' && !b.trashed);

  if(doSearchDesign.trim()){
    const q = doSearchDesign.trim().toLowerCase();
    dispatchedAll = dispatchedAll.filter(b=>b.designNumber.toLowerCase().includes(q));
  }
  if(doSearchBrand.trim()){
    const q = doSearchBrand.trim().toLowerCase();
    dispatchedAll = dispatchedAll.filter(b=>(b.brand||'').toLowerCase().includes(q));
  }
  if(doSearchCustomer.trim()){
    const q = doSearchCustomer.trim().toLowerCase();
    dispatchedAll = dispatchedAll.filter(b=>String(b.customerName||'').toLowerCase().includes(q));
  }
  if(doSearchDate){
    dispatchedAll = dispatchedAll.filter(b=>dispatchDateKey(b.dispatchedAt)===doSearchDate);
  }

  let resultsHtml = '';
  if(!dispatchedAll.length){
    resultsHtml = `<div class="empty">${t('no_dispatched_orders')}${(doSearchDesign||doSearchBrand||doSearchCustomer||doSearchDate) ? ' '+t('no_dispatched_match') : ' '+t('no_dispatched_yet')}</div>`;
  } else {
    const dateGroups = {};
    dispatchedAll.forEach(b=>{
      const dk = dispatchDateKey(b.dispatchedAt);
      if(!dateGroups[dk]) dateGroups[dk] = {};
      if(!dateGroups[dk][b.customerName]) dateGroups[dk][b.customerName] = [];
      dateGroups[dk][b.customerName].push(b);
    });
    const dateKeys = Object.keys(dateGroups).sort((a,b)=>b.localeCompare(a));
    resultsHtml = dateKeys.map(dk=>{
      const custMap = dateGroups[dk];
      // Whoever's item was dispatched most recently shows first, so ticking
      // off orders one by one keeps moving the latest one to the top
      // instead of it settling at the bottom of the day's list.
      const custNamesSorted = Object.keys(custMap).sort((a,b)=>{
        const maxA = Math.max(...custMap[a].map(r=>new Date(r.dispatchedAt).getTime()));
        const maxB = Math.max(...custMap[b].map(r=>new Date(r.dispatchedAt).getTime()));
        return maxB - maxA;
      });
      const custCards = custNamesSorted.map(cname=>{
        const rows = custMap[cname].sort((a,b)=>(a.designNumber).localeCompare(b.designNumber));
        const total = totalsUi_(rows);
        const brands = [...new Set(rows.map(b=>b.brand).filter(Boolean))].join(', ');
        const lines = rows.map(b=>
          `<div class="item-line"><span>${t('design_word')} ${escapeHtml(b.designNumber)}${b.colour?(' · '+escapeHtml(b.colour)):''} · ${escapeHtml(b.size)}</span><span>${qtyUi_(b)} <button class="undo-link" onclick="undoDispatch('${b.id}')">${t('undo')}</button></span></div>`
        ).join('');
        return `<div class="cust-card">
          <div class="cust-head"><span class="name">${escapeHtml(cname)}${brands ? ` <span class="subtle">(${escapeHtml(brands)})</span>` : ''}</span><span class="set-pill done">${total}</span></div>
          ${lines}
          <div class="order-total-line"><span>${t('total')}</span><span>${total}</span></div>
          <div class="action-row">
            <button class="action-btn wa" onclick="shareWhatsAppDated('${cname.replace(/'/g,"\\'")}','${dk}')">${t('whatsapp')}</button>
            <button class="action-btn pr" onclick="printOrderDated('${cname.replace(/'/g,"\\'")}','${dk}')">${t('print')}</button>
            ${canCurrentUserDelete() ? `<button class="action-btn del" onclick="deleteOrderDated('${cname.replace(/'/g,"\\'")}','${dk}')">${t('delete_btn')}</button>` : ''}
          </div>
        </div>`;
      }).join('');
      return `<div class="date-section-label">${dispatchDateLabel(dk)}</div>${custCards}`;
    }).join('');
  }

  main.innerHTML = `
    <div class="card">
      <h2>${t('search_dispatched')}</h2>
      <label>${t('by_article_number')}</label>
      <input id="doSearchDesign" list="designList" placeholder="${t('article_ph')}" value="${escapeHtml(doSearchDesign)}" oninput="onDoSearch('design', this.value)">
      <label style="margin-top:10px;">${t('by_customer_name')}</label>
      <input id="doSearchCustomer" list="customerList" placeholder="${t('type_name')}" value="${escapeHtml(doSearchCustomer)}" oninput="onDoSearch('customer', this.value)">
      <label style="margin-top:10px;">${t('by_brand_name')}</label>
      <input id="doSearchBrand" list="brandList" placeholder="${t('type_brand_name')}" value="${escapeHtml(doSearchBrand)}" oninput="onDoSearch('brand', this.value)">
      <label style="margin-top:10px;">${t('by_date')}</label>
      <input id="doSearchDate" type="date" value="${escapeHtml(doSearchDate)}" oninput="onDoSearch('date', this.value)">
    </div>
    <div id="doResults">${resultsHtml}</div>
  `;
}

let doSearchDebounce_ = null;
function onDoSearch(which, val){
  if(which==='design') doSearchDesign = val;
  else if(which==='brand') doSearchBrand = val;
  else if(which==='customer') doSearchCustomer = val;
  else doSearchDate = val;
  // Only the results list is redrawn; the search boxes stay as they are, so the
  // phone keyboard does not jump up/down while typing.
  clearTimeout(doSearchDebounce_);
  doSearchDebounce_ = setTimeout(refreshDispatchedResultsOnly_, which==='date' ? 0 : 120);
}

function refreshDispatchedResultsOnly_(){
  const live = document.getElementById('doResults');
  if(!live){ render(); return; }
  const tmp = document.createElement('div');
  renderDispatchedOrders(tmp);
  const fresh = tmp.querySelector('#doResults');
  if(fresh) live.innerHTML = fresh.innerHTML; else render();
}

// Row passes the Article-number / Brand text typed in the Dispatched tab (if any).
function doRowOk_(b){
  const dq = doSearchDesign.trim().toLowerCase();
  const bq = doSearchBrand.trim().toLowerCase();
  if(dq && !String(b.designNumber||'').toLowerCase().includes(dq)) return false;
  if(bq && !(b.brand||'').toLowerCase().includes(bq)) return false;
  return true;
}
function getDatedRows(cname, dk){
  return bookings.filter(b=>b.customerName===cname && b.status==='dispatched' && !b.trashed && dispatchDateKey(b.dispatchedAt)===dk && doRowOk_(b))
    .sort((a,b)=>(a.designNumber).localeCompare(b.designNumber));
}

function buildDatedOrderPdf(cname, dk){
  const rows = getDatedRows(cname, dk);
  const total = totalsUi_(rows);
  const hdr = unitHdr_(rows);
  const tableRows = rows.map(b=>[b.designNumber, b.colour||'-', b.size, b.brand||'-', qtyCell_(b, hdr)]);
  const pp = pdfWithPrice_(['Design Number','Colour','Size','Brand',hdr], tableRows, rows, hdr);
  return {
    blob: buildPdfBlob(`${cname}`, `${COMPANY_NAME} · Dispatch Date: ${dispatchDateLabel(dk)}`, pp.columns, pp.tableRows, `Total: ${totalsPdf_(rows)}${amtFooter_(pp)}`, { heading: 'Dispatched Order' }),
    total
  };
}

function printOrderDated(cname, dk){
  const { blob } = buildDatedOrderPdf(cname, dk);
  if(!blob){ alert(t('pdf_gen_fail')); return; }
  openPdfBlob(blob, `Order-${cname.replace(/[^a-z0-9]/gi,'_')}-${dk}.pdf`);
}

async function shareWhatsAppDated(cname, dk){
  const { blob, total } = buildDatedOrderPdf(cname, dk);
  if(!blob){ alert(t('pdf_gen_fail')); return; }
  await sharePdfBlob(blob, `Order-${cname.replace(/[^a-z0-9]/gi,'_')}-${dk}.pdf`, `Order — ${cname}`, `Order — ${cname} (${dispatchDateLabel(dk)}), Total ${total}`);
}

async function deleteOrderDated(cname, dk){
  if(!canCurrentUserDelete()){ alert(t('delete_not_allowed')); return; }
  if(!confirm(`Delete this dispatched order of ${cname}?\nAre you sure?`)) return;
  markBusy(t('deleting_word'));
  let total = 0;
  bookings.forEach(b=>{
    if(b.customerName===cname && b.status==='dispatched' && !b.trashed && dispatchDateKey(b.dispatchedAt)===dk && doRowOk_(b)){
      b.trashed = true;
      b.trashedAt = new Date().toISOString();
      b.trashedBy = currentStaff ? { name: currentStaff.name, mobile: currentStaff.mobile } : null;
      total += b.qty;
    }
  });
  await saveData();
  await logActivity('Order Deleted', `${cname} — ${dispatchDateLabel(dk)} — ${total} sets`);
  render();
}

// Restores just ONE deleted line (not the whole party).
async function restoreOne(id){
  const b = bookings.find(x=>x.id===id);
  if(!b || !b.trashed) return;
  markBusy(t('restoring_word'));
  b.trashed = false;
  b.trashedAt = null;
  await saveData();
  await logActivity('Order Item Restored', `${b.customerName} — Design ${b.designNumber}${b.colour ? ' '+b.colour : ''}, ${b.size} × ${b.qty} ${unitEn_(unitOf_(b))}`);
  render();
}

async function restoreOrder(cname){
  markBusy(t('restoring_word'));
  let total = 0;
  bookings.forEach(b=>{
    if(b.customerName===cname && b.trashed){
      b.trashed = false;
      b.trashedAt = null;
      total += b.qty;
    }
  });
  await saveData();
  await logActivity('Order Restored', `${cname} — ${total} sets`);
  render();
}

async function permanentDeleteOrder(cname){
  if(!canCurrentUserDelete()){ alert(t('delete_not_allowed')); return; }
  if(!confirm(`${cname} — ${t('perm_delete_confirm')}`)) return;
  markBusy(t('deleting_word'));
  let total = 0;
  bookings = bookings.filter(b=>{
    if(b.customerName===cname && b.trashed){ total += b.qty; return false; }
    return true;
  });
  await saveData();
  await logActivity('Order Permanently Deleted', `${cname} — ${total} sets removed for good`);
  render();
}

function renderPendingOrders(main){
  const pendingAll = bookings.filter(b=>b.status==='pending' && !b.trashed);

  const searchBar = `
    <div class="card">
      <h2>${t('search_party')}</h2>
      <input id="pdSearchCustomer" placeholder="${t('enter_customer_name')}" value="${escapeHtml(pdSearchCustomer)}" oninput="onPdSearch('customer', this.value)">
      <label style="margin-top:10px;">${t('by_brand_name')} (${t('optional_word')})</label>
      <input id="pdSearchBrand" list="brandList" placeholder="${t('type_brand_name')}" value="${escapeHtml(pdSearchBrand)}" oninput="onPdSearch('brand', this.value)">
      <label style="margin-top:10px;">${t('from_date')} (${t('optional_word')})</label>
      <input id="pdFromDate" type="date" value="${escapeHtml(pdFromDate)}" oninput="onPdSearch('from', this.value)">
      <label style="margin-top:10px;">${t('to_date')} (${t('optional_word')})</label>
      <input id="pdToDate" type="date" value="${escapeHtml(pdToDate)}" oninput="onPdSearch('to', this.value)">
    </div>
  `;

  if(!pendingAll.length){
    main.innerHTML = searchBar + `<div id="pdResults"><div class="empty">${t('no_pending_orders')}</div></div>`;
    return;
  }

  let filtered = pendingAll;
  if(pdSearchBrand.trim()){
    const bq = pdSearchBrand.trim().toLowerCase();
    filtered = filtered.filter(b=>(b.brand||'').toLowerCase().includes(bq));
  }
  if(pdFromDate || pdToDate){
    filtered = filtered.filter(b=>inPdRange_(b.orderedAt));
  }

  let customers = [...new Set(filtered.map(b=>b.customerName))];
  if(pdSearchCustomer.trim()){
    const q = pdSearchCustomer.trim().toLowerCase();
    customers = customers.filter(n=>n.toLowerCase().includes(q));
  }

  if(!customers.length){
    main.innerHTML = searchBar + `<div id="pdResults"><div class="empty">${t('no_customer_found')}</div></div>`;
    return;
  }

  // Group by the date the order was placed (orderedAt), same pattern as the
  // Dispatched tab's dispatch-date grouping, so today's orders sit under
  // today and older orders sit under their own date.
  const dateGroups = {};
  filtered.filter(b=>customers.includes(b.customerName)).forEach(b=>{
    const dk = dispatchDateKey(b.orderedAt);
    if(!dateGroups[dk]) dateGroups[dk] = {};
    if(!dateGroups[dk][b.customerName]) dateGroups[dk][b.customerName] = [];
    dateGroups[dk][b.customerName].push(b);
  });
  const dateKeys = Object.keys(dateGroups).sort((a,b)=>b.localeCompare(a));

  const cards = dateKeys.map(dk=>{
    const custMap = dateGroups[dk];
    // Most recently created order shows at the top of its date group, so
    // whichever customer's order was just booked appears first, not
    // whichever customer happened to be first in the underlying data.
    const custNamesSorted = Object.keys(custMap).sort((a,b)=>{
      const maxA = Math.max(...custMap[a].map(r=>new Date(r.orderedAt).getTime()));
      const maxB = Math.max(...custMap[b].map(r=>new Date(r.orderedAt).getTime()));
      return maxB - maxA;
    });
    const custCards = custNamesSorted.map(cname=>{
      const rows = custMap[cname].sort((a,b)=>(a.designNumber).localeCompare(b.designNumber));
      const total = totalsShort_(rows);
      const isEditing = editingPendingGroup && editingPendingGroup.cname===cname && editingPendingGroup.dk===dk;

      if(isEditing){
        // Edit mode: every line becomes editable (design/colour/size/qty),
        // so a mistake made while booking can be corrected right here
        // instead of deleting and re-creating the whole order.
        const editRows = rows.map(b=>`
          <div class="item-line" style="flex-wrap:wrap;gap:6px;align-items:center;">
            <input id="editDesign-${b.id}" value="${escapeHtml(b.designNumber)}" style="width:90px;" placeholder="${t('design_number')}">
            <input id="editColour-${b.id}" value="${escapeHtml(b.colour||'')}" style="width:90px;" placeholder="${t('colour_optional')}">
            <input id="editSize-${b.id}" value="${escapeHtml(b.size)}" style="width:80px;" placeholder="${t('size')}">
            <input id="editQty-${b.id}" type="number" min="1" value="${b.qty}" style="width:60px;">
            ${unitSelectHtml_(`editUnit-${b.id}`, unitOf_(b), 'width:92px;')}
            <button class="chip x" style="border:none;background:none;color:var(--rust);font-weight:700;" onclick="removePendingEditRow('${b.id}')">✕</button>
          </div>
        `).join('');
        return `<div class="cust-card">
          <div class="cust-head"><span class="name">${escapeHtml(cname)}</span><span class="set-pill pending">${t('editing')}</span></div>
          ${editRows}
          <div style="margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);">
            <div class="section-label" style="margin-top:0;">➕ ${t('add_more_lines')}</div>
            <div id="editNewList">${editNewListHtml_()}</div>
            <div id="editNewMsg"></div>
            <div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center;">
              <input id="editNewDesign" placeholder="${t('design_number')}" style="width:92px;">
              <input id="editNewColour" placeholder="${t('colour_optional')}" style="width:92px;">
              <input id="editNewSize" placeholder="${t('size')} (2/6 8/16)" style="width:118px;" onkeydown="if(event.key==='Enter'){event.preventDefault();addEditNewLine_();}">
              <input id="editNewQty" type="number" min="1" value="1" style="width:56px;">
              ${unitSelectHtml_('editNewUnit', unitDefault_(), 'width:92px;')}
              <input id="editNewBrand" placeholder="${t('brand_word')}" value="${escapeHtml((rows[0] && rows[0].brand) || '')}" style="width:100px;">
              <input id="editNewPrice" type="number" inputmode="decimal" min="0" placeholder="₹" style="width:64px;">
              <button class="action-btn pr" style="padding:8px 12px;" onclick="addEditNewLine_()">${t('add_line_btn')}</button>
            </div>
            <div style="font-size:11.5px;color:#7e8896;margin-top:4px;">${t('add_line_hint')}</div>
          </div>
          <div class="action-row">
            <button class="action-btn pr" onclick="saveEditPendingGroup('${cname.replace(/'/g,"\\'")}','${dk}',this)">${t('save_changes')}</button>
            <button class="action-btn del" onclick="cancelEditPendingGroup()">${t('cancel')}</button>
          </div>
        </div>`;
      }

      const lines = rows.map(b=>{
        const cit = catItemForRow_(b);
        const th = cit ? `<span class="pend-th" onclick="pendPhotoZoom('${cit.id}')"><img data-cid="${cit.id}" alt=""></span>` : '';
        return `<div class="item-line"><span style="display:inline-flex;align-items:center;">${th}<span>${t('design_word')} ${escapeHtml(b.designNumber)}${b.colour?(' · '+escapeHtml(b.colour)):''} · ${escapeHtml(b.size)}${b.brand?(' · '+escapeHtml(b.brand)):''}</span></span>
          <span style="display:inline-flex;align-items:center;gap:8px;">
            <span>${qtyUi_(b)}</span>
            <button class="chip" style="cursor:pointer;padding:3px 9px;font-size:11px;border:1px solid var(--navy);background:#fff;color:var(--navy);" onclick="this.disabled=true;this.style.opacity='0.45';this.textContent='...';dispatchOne('${b.id}')">${t('dispatch_btn')}</button>
          </span>
        </div>`;
      }).join('');
      return `<div class="cust-card">
        <div class="cust-head"><span class="name">${escapeHtml(cname)}</span>
          <span style="display:inline-flex;align-items:center;gap:6px;">
            <span class="set-pill pending">${total} ${t('badge_pending')}</span>
            <button class="action-btn pr" style="padding:5px 10px;font-size:12px;" onclick="this.disabled=true;this.style.opacity='0.45';this.textContent='${t('dispatching')}';dispatchGroupDated('${cname.replace(/'/g,"\\'")}','${dk}')">${t('dispatch_btn')}</button>
          </span>
        </div>
        ${lines}
        ${pendLocHtml_(rows)}
        <div class="action-row">
          ${pendLocBtn_(rows)}
          <button class="action-btn wa" onclick="shareWhatsAppPendingDated('${cname.replace(/'/g,"\\'")}','${dk}')">${t('whatsapp')}</button>
          <button class="action-btn pr" onclick="printPendingOrderDated('${cname.replace(/'/g,"\\'")}','${dk}')">${t('print')}</button>
          <button class="action-btn pr" onclick="startEditPendingGroup('${cname.replace(/'/g,"\\'")}','${dk}')">${t('edit_btn')}</button>
          ${canCurrentUserDelete() ? `<button class="action-btn del" onclick="deletePendingOrderDated('${cname.replace(/'/g,"\\'")}','${dk}')">${t('delete_btn')}</button>` : ''}
        </div>
      </div>`;
    }).join('');
    return `<div class="date-section-label">${dispatchDateLabel(dk)}</div>${custCards}`;
  }).join('');

  main.innerHTML = searchBar + `<div id="pdResults">${cards}</div>`;
  catHydrate_(main);
}

let editNewLines_ = [];      // lines staged in the Pending-edit card, added to the order on Save
let isSavingEdit_ = false;

function editNewListHtml_(){
  return editNewLines_.map((l,i)=>`<div class="item-line"><span>${t('design_word')} ${escapeHtml(l.design)}${l.colour?(' · '+escapeHtml(l.colour)):''} · ${escapeHtml(l.size)}${l.brand?(' · '+escapeHtml(l.brand)):''}${l.price?(' · ₹'+escapeHtml(String(l.price))):''}</span><span style="display:inline-flex;align-items:center;gap:8px;"><span>${l.qty} ${unitUi_(l.unit||'set')}</span><button class="chip x" style="border:none;background:none;color:var(--rust);font-weight:700;" onclick="removeEditNewLine_(${i})">✕</button></span></div>`).join('');
}
function refreshEditNewList_(){
  const el = document.getElementById('editNewList');
  if(el) el.innerHTML = editNewListHtml_();
}
function removeEditNewLine_(i){
  if(!confirm('Remove this new line?\nAre you sure?')) return;
  editNewLines_.splice(i,1); refreshEditNewList_();
}

function startEditPendingGroup(cname, dk){
  editingPendingGroup = { cname, dk };
  editNewLines_ = [];
  render();
}
function cancelEditPendingGroup(){
  editingPendingGroup = null;
  editNewLines_ = [];
  render();
}
function removePendingEditRow(bookingId){
  if(!confirm('Delete this line from the order?\nAre you sure?')) return;
  const row = document.querySelector(`#editDesign-${bookingId}`)?.closest('.item-line');
  if(row) row.dataset.removed = '1';
  if(row) row.style.display = 'none';
}

// Stages one new design/size line (sizes can be typed together, e.g. "2/6 8/16").
// Returns true if something was staged, false if there was an error or nothing to add.
function addEditNewLine_(){
  if(!editingPendingGroup) return false;
  const val = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
  const design = val('editNewDesign'), colourRaw = val('editNewColour'), rawSize = val('editNewSize');
  const brand = val('editNewBrand'), price = val('editNewPrice');
  const qty = parseInt(val('editNewQty')) || 0;
  const unit = val('editNewUnit') || 'set';
  const msg = document.getElementById('editNewMsg');
  if(!design && !rawSize) return false;                         // nothing typed
  if(!design){ if(msg) msg.innerHTML = `<div class="msg err">${t('enter_design_err')}</div>`; return false; }
  if(!rawSize || qty <= 0){ if(msg) msg.innerHTML = `<div class="msg err">${t('size_qty_err')}</div>`; return false; }

  const tokens = rawSize.split(/[\s,]+/).map(s=>s.trim()).filter(Boolean);
  const sizes = tokens.length === 1 ? expandSizeRange_(tokens[0], brand) : tokens;
  if(!sizes.length){ if(msg) msg.innerHTML = `<div class="msg err">${t('size_qty_err')}</div>`; return false; }
  const colours = parseColourList_(colourRaw);

  const { cname, dk } = editingPendingGroup;
  const groupRows = getPendingDatedRows(cname, dk);
  const nd = normKey_(design), nb = normKey_(brand);
  const dups = [], ok = [];
  colours.forEach(col=>{
    const nc = normKey_(col);
    sizes.forEach(size=>{
      const ns = normKey_(size);
      if(ok.some(x=>normKey_(x.colour)===nc && normKey_(x.size)===ns)) return;
      // exactly the same line already in THIS order (or already staged)
      const inOrder = groupRows.some(b=>normKey_(b.designNumber)===nd && normKey_(b.colour)===nc && normKey_(b.size)===ns && normKey_(b.brand)===nb) ||
        editNewLines_.some(l=>normKey_(l.design)===nd && normKey_(l.colour)===nc && normKey_(l.size)===ns);
      if(inOrder){ dups.push({ colour: col, size, saved: null }); return; }
      // exactly the same line ordered earlier on ANOTHER date
      const other = nb ? bookings.find(b=>!b.trashed && normKey_(b.customerName)===normKey_(cname) && normKey_(b.brand)===nb &&
        normKey_(b.designNumber)===nd && normKey_(b.colour)===nc && normKey_(b.size)===ns && dispatchDateKey(b.orderedAt)!==dk) : null;
      if(other){ dups.push({ colour: col, size, saved: other }); return; }
      ok.push({ colour: col, size });
    });
  });
  if(dups.length){
    showDuplicateList_(design, dups, ok.length > 0);
    if(!ok.length) return false;
  }

  ok.forEach(x=> editNewLines_.push({ design, colour: x.colour, size: x.size, qty, unit, brand, price }));
  ['editNewDesign','editNewColour','editNewSize','editNewPrice'].forEach(id=>{ const el = document.getElementById(id); if(el) el.value = ''; });
  const q = document.getElementById('editNewQty'); if(q) q.value = '1';
  if(msg) msg.innerHTML = '';
  refreshEditNewList_();
  const d = document.getElementById('editNewDesign'); if(d) d.focus();
  return true;
}

async function saveEditPendingGroup(cname, dk, btn){
  if(isSavingEdit_) return;
  // Anything typed in the "add new line" boxes but not yet tapped "+ Add" is added now.
  const hasTyped = ['editNewDesign','editNewSize'].some(id=>{ const el = document.getElementById(id); return el && el.value.trim(); });
  if(hasTyped && !addEditNewLine_()) return;     // error already shown — stay in edit mode

  // Show the button reacting RIGHT AWAY
  isSavingEdit_ = true;
  if(btn){ btn.disabled = true; btn.style.opacity = '0.6'; btn.textContent = '⏳ ' + t('saving_word'); }
  const cancelBtn = btn && btn.parentElement ? btn.parentElement.querySelector('.del') : null;
  if(cancelBtn) cancelBtn.disabled = true;
  await new Promise(r=>setTimeout(r, 30));       // lets the browser paint the "Saving…" state first

  try{
    const rows = getPendingDatedRows(cname, dk);
    const baseOrderedAt = rows[0] ? rows[0].orderedAt : new Date().toISOString();
    const fallbackBrand = rows[0] ? (rows[0].brand || '') : '';
    for(const b of rows){
      const designEl = document.getElementById(`editDesign-${b.id}`);
      if(!designEl) continue; // row was marked removed
      const row = designEl.closest('.item-line');
      if(row && row.dataset.removed === '1'){
        b.trashed = true;
        b.trashedAt = new Date().toISOString();
        b.trashedBy = currentStaff ? { name: currentStaff.name, mobile: currentStaff.mobile } : null;
        continue;
      }
      const newDesign = designEl.value.trim();
      const newColour = document.getElementById(`editColour-${b.id}`).value.trim();
      const newSize = document.getElementById(`editSize-${b.id}`).value.trim();
      const newQty = parseInt(document.getElementById(`editQty-${b.id}`).value) || b.qty;
      if(newDesign) b.designNumber = newDesign;
      b.colour = newColour;
      if(newSize) b.size = newSize;
      b.qty = newQty;
      const unEl = document.getElementById(`editUnit-${b.id}`);
      if(unEl) b.unit = unEl.value;
    }
    // New lines join the SAME order (same customer + same order date), so they show in this same card.
    let added = 0;
    editNewLines_.forEach(l=>{
      bookings.push({
        id: uid(),
        customerName: cname,
        brand: l.brand || fallbackBrand,
        designNumber: l.design,
        colour: l.colour || '',
        size: l.size,
        qty: l.qty,
        unit: l.unit || 'set',
        pricePerPcs: l.price || '',
        status: 'pending',
        orderedAt: baseOrderedAt,
        dispatchedAt: null,
        orderedBy: currentStaff ? { name: currentStaff.name, mobile: currentStaff.mobile } : null,
        addedLater: true
      });
      added += l.qty;
    });
    await saveData();
    await logActivity('Pending Order Edited', `${cname} — ${dispatchDateLabel(dk)}${added ? ' (+' + added + ' sets added)' : ''}`);
    editingPendingGroup = null;
    editNewLines_ = [];
    render();
    showInAppToast_(t('saved_ok'));
  } finally {
    isSavingEdit_ = false;
  }
}

function getPendingDatedRows(cname, dk){
  return bookings.filter(b=>b.customerName===cname && b.status==='pending' && !b.trashed && dispatchDateKey(b.orderedAt)===dk && pdBrandOk_(b))
    .sort((a,b)=>(a.designNumber).localeCompare(b.designNumber));
}

function buildPendingOrderPdfDated(cname, dk){
  const rows = getPendingDatedRows(cname, dk);
  const total = totalsUi_(rows);
  const hdr = unitHdr_(rows);
  const tableRows = rows.map(b=>[b.designNumber, b.colour||'-', b.size, b.brand||'-', qtyCell_(b, hdr)]);
  const pp = pdfWithPrice_(['Design Number','Colour','Size','Brand',hdr], tableRows, rows, hdr);
  return {
    blob: buildPdfBlob(`${cname}`, `${COMPANY_NAME} · ${dispatchDateLabel(dk)}`, pp.columns, pp.tableRows, `${t('total')}: ${totalsPdf_(rows)}${amtFooter_(pp)}`, { heading: 'Order' }),
    total
  };
}

function printPendingOrderDated(cname, dk){
  const { blob } = buildPendingOrderPdfDated(cname, dk);
  if(!blob){ alert(t('pdf_gen_fail')); return; }
  openPdfBlob(blob, `Pending-${cname.replace(/[^a-z0-9]/gi,'_')}-${dk}.pdf`);
}

async function shareWhatsAppPendingDated(cname, dk){
  const { blob, total } = buildPendingOrderPdfDated(cname, dk);
  if(!blob){ alert(t('pdf_gen_fail')); return; }
  await sharePdfBlob(blob, `Pending-${cname.replace(/[^a-z0-9]/gi,'_')}-${dk}.pdf`, `${t('pending_order')} — ${cname}`, `${t('pending_order')} — ${cname} (${dispatchDateLabel(dk)}), ${t('total')} ${total}`);
}

async function deletePendingOrderDated(cname, dk){
  if(!canCurrentUserDelete()){ alert(t('delete_not_allowed')); return; }
  if(!confirm(`Delete this pending order of ${cname}?\nAre you sure?`)) return;
  markBusy(t('deleting_word'));
  let total = 0;
  bookings.forEach(b=>{
    if(b.customerName===cname && b.status==='pending' && !b.trashed && dispatchDateKey(b.orderedAt)===dk && pdBrandOk_(b)){
      b.trashed = true;
      b.trashedAt = new Date().toISOString();
      b.trashedBy = currentStaff ? { name: currentStaff.name, mobile: currentStaff.mobile } : null;
      total += b.qty;
    }
  });
  await saveData();
  await logActivity('Order Deleted', `${cname} — ${dispatchDateLabel(dk)} — ${total} sets`);
  render();
}

function buildPendingOrderPdf(cname){
  const rows = bookings.filter(b=>b.customerName===cname && b.status==='pending' && !b.trashed && pdBrandOk_(b) && ((!pdFromDate && !pdToDate) || inPdRange_(b.orderedAt)))
    .sort((a,b)=>(a.designNumber).localeCompare(b.designNumber));
  const total = totalsUi_(rows);
  const hdr = unitHdr_(rows);
  const tableRows = rows.map(b=>[b.designNumber, b.colour||'-', b.size, b.brand||'-', qtyCell_(b, hdr)]);

  return {

// Row passes the Brand / Date filters typed in the Customers tab (if any), so the
// card, its totals, Print, WhatsApp and Delete all use exactly the same rows.
function custRowOk_(b){
  const bq = customerBrandFilter.trim().toLowerCase();
  if(bq && !(b.brand||'').toLowerCase().includes(bq)) return false;
  if(customerDateFilter){
    const od = dispatchDateKey(b.orderedAt)===customerDateFilter;
    const dd = b.dispatchedAt && dispatchDateKey(b.dispatchedAt)===customerDateFilter;
    if(!od && !dd) return false;
  }
  return true;
}
function buildCustomerOrderPdf(cname){
  // Grouped by date first (oldest at top, going down to the most recent),
  // so every line from the same date sits together as one block, instead
  // of dates being mixed together by design number.
  const rows = bookings.filter(b=>b.customerName===cname && !b.trashed && custRowOk_(b))
    .sort((a,b)=> dispatchDateKey(a.orderedAt).localeCompare(dispatchDateKey(b.orderedAt)) || (a.designNumber).localeCompare(b.designNumber));
  const hdr = unitHdr_(rows);
  // Includes the order date per line — this list spans every order a
  // customer has ever placed, so staff need to see which line came from
  // which date. Pending and Dispatched sets sit in separate columns.
  const tableRows = rows.map(b=>{
    const done = b.status==='dispatched';
    return [dispatchDateLabel(dispatchDateKey(b.orderedAt)), b.designNumber, b.colour||'-', b.size, b.brand||'-', done ? '' : qtyCell_(b, hdr), done ? qtyCell_(b, hdr) : ''];
  });
  const total = totalsUi_(rows);
  const pendRowsX = rows.filter(b=>b.status!=='dispatched'), doneRowsX = rows.filter(b=>b.status==='dispatched');
  const pp = pdfWithPrice_(['Date','Design Number','Colour','Size','Brand',`Pending ${hdr}`,`Dispatched ${hdr}`], tableRows, rows, 'Brand');
  const setIdx = pp.columns.length - 2;
  const colStyles = {}; colStyles[setIdx] = { halign:'center' }; colStyles[setIdx+1] = { halign:'center' };
  return {
    blob: buildPdfBlob(`${cname}`, `${COMPANY_NAME} · ${new Date().toLocaleDateString('en-IN')}`, pp.columns, pp.tableRows, `Pending: ${totalsPdf_(pendRowsX)}   |   Dispatched: ${totalsPdf_(doneRowsX)}   |   Total: ${totalsPdf_(rows)}${amtFooter_(pp)}`, { columnStyles: colStyles, heading: 'Order Status' }),
    total
  };
}

/* ---------------- EDIT CUSTOMER NAME / CITY ----------------
   Fixes a wrongly typed customer name (or city). Every order of that customer — pending,
   dispatched and deleted — moves to the corrected name. If the corrected name is the same
   as another existing customer, the two are merged into one. */
function editCustomerName(oldName){
  const old = document.getElementById('renameCustOverlay');
  if(old) old.remove();
  const ov = document.createElement('div');
  ov.id = 'renameCustOverlay';
  ov.style.cssText = 'position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;';
  ov.innerHTML = `
    <div style="background:#fff;width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:16px 16px 22px;box-shadow:0 -6px 24px rgba(0,0,0,.25);">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">
        <div style="font-weight:700;font-size:16px;color:#1B2430;">✏️ Edit Customer Name</div>
        <button id="renCustClose" style="background:none;border:none;font-size:22px;color:#5b6472;">✕</button>
      </div>
      <div style="font-size:12.5px;color:#5b6472;margin-bottom:8px;">Correct the name / city. All orders of this customer will be updated.</div>
      <input id="renCustInput" value="${escapeHtml(oldName)}" autocomplete="off" style="margin-bottom:10px;">
      <div id="renCustMsg"></div>
      <div style="display:flex;gap:8px;">
        <button id="renCustCancel" style="flex:1;background:#EAF1FB;color:#1656A6;border:none;border-radius:12px;padding:13px;font-weight:700;font-size:15px;">${t('cancel')}</button>
        <button id="renCustSave" style="flex:1;background:#1656A6;color:#fff;border:none;border-radius:12px;padding:13px;font-weight:700;font-size:15px;">${t('save_changes')}</button>
      </div>
    </div>`;
  document.body.appendChild(ov);
  const close = ()=>ov.remove();
  ov.addEventListener('click', e=>{ if(e.target === ov) close(); });
  document.getElementById('renCustClose').onclick = close;
  document.getElementById('renCustCancel').onclick = close;
  const inp = document.getElementById('renCustInput');
  inp.focus(); inp.select();
  const doSave = async ()=>{
    const btn = document.getElementById('renCustSave');
    const msg = document.getElementById('renCustMsg');
    const newRaw = inp.value.trim().replace(/\s+/g,' ');
    if(!newRaw){ msg.innerHTML = `<div class="msg err">${t('enter_customer_err')}</div>`; return; }
    if(newRaw === oldName){ close(); return; }
    // Same name as a DIFFERENT existing customer -> merge into that customer's spelling
    const other = bookings.find(b=>b.customerName !== oldName && normKey_(b.customerName) === normKey_(newRaw));
    const finalName = other ? String(other.customerName) : newRaw;
    if(other && !confirm(`"${finalName}" already exists.\nMerge all orders of "${oldName}" into it?\nAre you sure?`)) return;
    btn.disabled = true; btn.style.opacity = '0.6'; btn.textContent = '⏳ ' + t('saving_word');
    await new Promise(r=>setTimeout(r, 30));
    let n = 0;
    bookings.forEach(b=>{ if(b.customerName === oldName){ b.customerName = finalName; n++; } });
    if(expandedCustomer === oldName) expandedCustomer = finalName;
    editingPendingGroup = null;
    await saveData();
    await logActivity('Customer Renamed', `${oldName} → ${finalName} (${n} lines)`);
    close();
    render();
    showInAppToast_(t('saved_ok'));
  };
  document.getElementById('renCustSave').onclick = doSave;
  inp.addEventListener('keydown', e=>{ if(e.key === 'Enter'){ e.preventDefault(); doSave(); } });
}

function renderCustomers(main){

    .filter(c=>c.toLowerCase().includes(customerFilter.trim().toLowerCase()));

  if(customerBrandFilter.trim() || customerDateFilter){
    customers = customers.filter(c=>activeBookings.some(b=>b.customerName===c && custRowOk_(b)));
  }

  if(!activeBookings.length){
    main.innerHTML = `<div class="card"><div class="empty">${t('no_order_yet')}</div></div>`;
    return;
  }

  const cards = customers.map(cname=>{
    const rows = activeBookings.filter(b=>b.customerName===cname && custRowOk_(b));
    const doneRows_ = rows.filter(b=>b.status==='dispatched');
    const pendRows_ = rows.filter(b=>b.status!=='dispatched');
    const total = totalsShort_(rows);
    const done = totalsShort_(doneRows_);
    const pending = totalsShort_(pendRows_);
    const hasPending_ = pendRows_.length > 0;
    const isOpen = expandedCustomer === cname;

    let detail = '';
    if(isOpen){
      const dispatchedRows = rows.filter(b=>b.status==='dispatched');
      const pendingRows = rows.filter(b=>b.status==='pending');
      detail = `<div class="cust-detail">
        ${dispatchedRows.length ? `<div class="section-label">${t('ready_goods')}</div>` + dispatchedRows.map(b=>`
          <div class="li"><span>${t('design_word')} ${escapeHtml(b.designNumber)}${b.colour?(' · '+escapeHtml(b.colour)):''} · ${escapeHtml(b.size)}${b.brand?(' · '+escapeHtml(b.brand)):''} · ${qtyShort_(b)}</span>
          <button class="undo-link" onclick="undoDispatch('${b.id}')">${t('undo')}</button></div>
        `).join('') : ''}
        ${pendingRows.length ? pendingBlockHtml_(cname, pendingRows) : ''}
        ${orderLocHtml_(rows)}
      </div>`;
    }

    return `<div class="cust-card" onclick="toggleCustomer('${cname.replace(/'/g,"\\'")}')" style="cursor:pointer;">
      <div class="cust-head"><span class="name">${escapeHtml(cname)}</span>
        <span class="set-pill ${hasPending_?'pending':'done'}">${hasPending_ ? pending+' '+t('badge_pending') : t('complete')}</span>
      </div>
      <div class="summary-row">
        <span>${t('total')}: ${total}</span>
        <span>${t('dispatched')}: ${done}</span>
        <span>${t('pending_sets')}: ${pending}</span>
      </div>
      <div class="action-row" onclick="event.stopPropagation();">
        <button class="action-btn wa" onclick="shareWhatsAppCustomer('${cname.replace(/'/g,"\\'")}')">${t('whatsapp')}</button>
        <button class="action-btn pr" onclick="printCustomerOrder('${cname.replace(/'/g,"\\'")}')">${t('print')}</button>
        <button class="action-btn pr" style="background:#fff;color:var(--navy);border:1.5px solid var(--navy);" onclick="editCustomerName('${cname.replace(/'/g,"\\'")}')">✏️ ${t('edit_btn')}</button>
        ${canCurrentUserDelete() ? `<button class="action-btn del" onclick="deleteCustomerOrderFull('${cname.replace(/'/g,"\\'")}')">${t('delete_btn')}</button>` : ''}
      </div>
      ${detail}
    </div>`;
  }).join('');

  main.innerHTML = `
    <div class="card filter-input" style="margin-bottom:14px;">
      <label>${t('search_customer')}</label>
      <input id="custFilter" placeholder="${t('type_name')}" value="${escapeHtml(customerFilter)}" oninput="onCustomerFilter(this.value)">
      <label style="margin-top:10px;">${t('search_by_brand')}</label>
      <input id="custBrandFilter" list="brandList" placeholder="${t('type_brand_name')}" value="${escapeHtml(customerBrandFilter)}" oninput="onCustomerBrandFilter(this.value)">
      <label style="margin-top:10px;">${t('by_date')}</label>
      <input id="custDateFilter" type="date" value="${escapeHtml(customerDateFilter)}" oninput="onCustomerDateFilter(this.value)">
    </div>
    <div id="custResults">${cards || `<div class="empty">${t('no_customer_found')}</div>`}</div>
  `;
}

// Builds the "Pending Order" part of an opened customer card, including the Cancel
// button next to the heading and the tick-boxes / Select All when Cancel is switched on.
function pendingBlockHtml_(cname, pendingRows){
  const cq = cname.replace(/'/g, "\\'");
  const inCancel = (pendingCancelFor === cname);
  const selCount = pendingRows.filter(b=>pendingCancelSel.has(b.id)).length;
  const allSel = pendingRows.length > 0 && selCount === pendingRows.length;

  let html = `<div class="section-label pend-head"><span>${t('pending_order')}</span>` +
    `<button class="pend-cancel-btn" onclick="event.stopPropagation(); startPendingCancel('${cq}')">${inCancel ? t('pend_cancel_close') : t('pend_cancel')}</button>` +
    `</div>`;

  if(inCancel){
    html += `<label class="pend-sel-row pend-selall" onclick="event.stopPropagation()">
      <input type="checkbox" ${allSel?'checked':''} onchange="togglePendingCancelAll('${cq}')">
      <span><b>${t('pend_select_all')}</b> (${pendingRows.length})</span></label>`;
  }

  html += pendingRows.map(b=>{
    const label = `${t('design_word')} ${escapeHtml(b.designNumber)}${b.colour?(' · '+escapeHtml(b.colour)):''} · ${escapeHtml(b.size)}${b.brand?(' · '+escapeHtml(b.brand)):''} · ${qtyShort_(b)}`;
    if(inCancel){
      return `<label class="pend-sel-row" onclick="event.stopPropagation()">
        <input type="checkbox" ${pendingCancelSel.has(b.id)?'checked':''} onchange="togglePendingCancelSel('${b.id}')">
        <span>${label}</span></label>`;
    }
    return `<div class="li"><span>${label}</span><span style="color:var(--rust);">${t('badge_pending')}</span></div>`;
  }).join('');

  if(inCancel){
    html += `<div class="pend-cancel-bar"><button class="action-btn del" ${selCount?'':'disabled'} onclick="event.stopPropagation(); confirmPendingCancel('${cq}')">${t('pend_cancel_selected')} (${selCount})</button></div>`;
  }
  return html;
}

function startPendingCancel(cname){
  // The button is always visible; if this login has no Delete right, say so clearly instead of hiding it.
  if(pendingCancelFor !== cname && !canCurrentUserDelete()){ alert(t('delete_not_allowed')); return; }
  if(pendingCancelFor === cname){ pendingCancelFor = null; }
  else { pendingCancelFor = cname; }
  pendingCancelSel = new Set();
  refreshCustomersResultsOnly_();
}

function visiblePendingIds_(cname){
  return bookings.filter(b=>b.customerName===cname && b.status==='pending' && !b.trashed && custRowOk_(b)).map(b=>b.id);
}

function togglePendingCancelSel(id){
  if(pendingCancelSel.has(id)) pendingCancelSel.delete(id); else pendingCancelSel.add(id);
  refreshCustomersResultsOnly_();
}

function togglePendingCancelAll(cname){
  const ids = visiblePendingIds_(cname);
  const allSel = ids.length > 0 && ids.every(id=>pendingCancelSel.has(id));
  if(allSel) ids.forEach(id=>pendingCancelSel.delete(id));
  else ids.forEach(id=>pendingCancelSel.add(id));
  refreshCustomersResultsOnly_();
}

// Cancelled pending items are not destroyed — they go to the Deleted tab,
// exactly like a deleted order, so they can still be restored from there.
async function confirmPendingCancel(cname){
  if(!canCurrentUserDelete()){ alert(t('delete_not_allowed')); return; }
  const ids = visiblePendingIds_(cname).filter(id=>pendingCancelSel.has(id));
  if(!ids.length){ alert(t('pend_cancel_none')); return; }
  if(!confirm(`${t('pend_cancel_confirm')} (${ids.length}) — ${cname}?`)) return;
  markBusy(t('processing_word'));
  const now = new Date().toISOString();
  const by = currentStaff ? { name: currentStaff.name, mobile: currentStaff.mobile } : null;
  const idSet = new Set(ids);
  let total = 0;
  bookings.forEach(b=>{
    if(idSet.has(b.id) && b.status==='pending' && !b.trashed){
      b.trashed = true;
      b.trashedAt = now;
      b.trashedBy = by;
      b.cancelledPending = true;
      total += b.qty;
    }
  });
  pendingCancelFor = null;
  pendingCancelSel = new Set();
  await saveData();
  await logActivity('Pending Items Cancelled', `${cname} — ${ids.length} item(s), ${total} sets`);
  render();
}

// Redraws only the customer list under the search boxes and leaves the text box
// being typed in untouched, so the phone keyboard no longer jumps up/down on every letter.
function refreshCustomersResultsOnly_(){
  const live = document.getElementById('custResults');
  if(!live){ render(); return; }
  const tmp = document.createElement('div');
  renderCustomers(tmp);
  const fresh = tmp.querySelector('#custResults');
  if(fresh) live.innerHTML = fresh.innerHTML; else render();
}

function onCustomerBrandFilter(val){

function toggleCustomer(cname){
  expandedCustomer = expandedCustomer === cname ? null : cname;

async function undoDispatch(bookingId){

  render();
}

const gid_ = id => document.getElementById(id);
let catalog = [];          // [{id,name,sizes,rate,brand,hidden,parts,imgV,createdAt}]  (photos are stored separately)
let catalogInbox = [];     // orders placed by customers from the catalog link
