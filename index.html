/* ---------- Catalog list is stored in PAGES: when one Google-Sheet cell is nearly full, the next designs go to the next row automatically ---------- */
const CAT_PAGE_MAX = 40000;                 // a Google Sheet cell holds 50,000 characters — stay safely below
let catPagesSaved_ = [];                    // the page texts as last saved/loaded, so only changed pages are re-sent
function catPageKey_(i){ return i === 0 ? 'catalog' : 'catalog_' + i; }
function catPaginate_(list){
  const stored = list.slice().reverse();    // oldest first -> new designs only touch the LAST page
  const pages = []; let cur = [], len = 2;
  for(const it of stored){
    const j = JSON.stringify(it);
    if(cur.length && len + j.length + 1 > CAT_PAGE_MAX){ pages.push(cur); cur = []; len = 2; }
    cur.push(it); len += j.length + 1;
  }
  pages.push(cur);
  return pages.map(p=>JSON.stringify(p));
}
function catFromPages_(texts, paged){
  const all = [].concat(...texts.map(t=>{ try{ return JSON.parse(t) || []; }catch(e){ return []; } }));
  return paged ? all.reverse() : all;
}
function catLoadLocal_(){
  try{
    const raw0 = localStorage.getItem('ssa_catalog');
    if(raw0 === null) return [];
    let meta = null; try{ meta = JSON.parse(localStorage.getItem('ssa_catalogMeta') || 'null'); }catch(e){}
    if(!meta || meta.v !== 2){ catPagesSaved_ = [raw0]; return catFromPages_([raw0], false); }
    const pages = [raw0];
    for(let i = 1; i < meta.pages; i++) pages.push(localStorage.getItem('ssa_' + catPageKey_(i)) || '[]');
    catPagesSaved_ = pages;
    return catFromPages_(pages, true);
  }catch(e){ return []; }
}
// Reads the whole catalog from the cloud (all pages). Returns { list, pages, sig } or null if it could not be read completely.
async function catLoadAll_(){
  const r = await Promise.all([ storageGet('catalogMeta'), storageGet('catalog') ]);
  const rawMeta = r[0], raw0 = r[1];
  if(raw0 === null || raw0 === undefined) return { list:[], pages:[], sig:'' };
  let meta = null; try{ meta = rawMeta ? JSON.parse(rawMeta) : null; }catch(e){}
  if(!meta || meta.v !== 2) return { list:catFromPages_([raw0], false), pages:[raw0], sig:raw0 };   // old single-cell format
  const pages = [raw0], idx = [];
  for(let i = 1; i < meta.pages; i++) idx.push(i);
  for(let k = 0; k < idx.length; k += 4){
    const got = await Promise.all(idx.slice(k, k + 4).map(i=>storageGet(catPageKey_(i))));
    for(const g of got){ if(g === null || g === undefined) return null; pages.push(g); }
  }
  return { list:catFromPages_(pages, true), pages, sig:rawMeta + '\u0001' + pages.join('\u0001') };
}
function catBusy_(){
  const busy = k=>isKeyBusy_(k);
  if(busy('catalog') || busy('catalogMeta')) return true;
  return [...dirtyKeys, ...pushInFlight_, ...pushQueued_].some(k=>/^catalog_\d+$/.test(k));
}

async function saveCatalog(){
  try{
    const pages = catPaginate_(catalog), oldN = catPagesSaved_.length;
    for(let i = 0; i < pages.length; i++){ if(pages[i] !== catPagesSaved_[i]) await storageSet(catPageKey_(i), pages[i]); }
    await storageSet('catalogMeta', JSON.stringify({ v:2, pages:pages.length }));
    for(let i = pages.length; i < oldN; i++) await storageSet(catPageKey_(i), '[]');   // clear pages that are no longer needed
    catPagesSaved_ = pages;
  }catch(e){ console.error('catalog save failed', e); }
}

/* ---------- Photos: stored in small pieces (separate keys) so the sheet never chokes ---------- */
const CAT_CHUNK = 40000;
const catImgMem_ = {};
function idbOpen_(){ return new Promise((res, rej)=>{ const r = indexedDB.open('ssa_cat', 1); r.onupgradeneeded = ()=>r.result.createObjectStore('img'); r.onsuccess = ()=>res(r.result); r.onerror = ()=>rej(r.error); }); }
async function idbGet_(k){ try{ const db = await idbOpen_(); return await new Promise(res=>{ const q = db.transaction('img').objectStore('img').get(k); q.onsuccess = ()=>res(q.result || null); q.onerror = ()=>res(null); }); }catch(e){ return null; } }
async function idbSet_(k, v){ try{ const db = await idbOpen_(); db.transaction('img', 'readwrite').objectStore('img').put(v, k); }catch(e){} }
function catKey_(it){ return it.id + ':' + (it.imgV || 0); }

let catActive_ = 0; const catWait_ = [];
function catLimit_(fn){                       // at most 3 photo downloads at the same time
  return new Promise(res=>{
    const run = async ()=>{ catActive_++; try{ res(await fn()); }finally{ catActive_--; const n = catWait_.shift(); if(n) n(); } };
    if(catActive_ < 3) run(); else catWait_.push(run);
  });
}
function catDriveUrl_(id, w){ return 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(id) + '&sz=w' + (w || 640); }
async function catGetImg_(it, big){
  if(it && it.fileId) return catDriveUrl_(it.fileId, big ? 1000 : 640);   // photo lives in Google Drive; only the link is kept in the sheet
  if(!it || !it.parts) return '';
  const ck = catKey_(it);
  if(catImgMem_[ck]) return catImgMem_[ck];
  let v = await idbGet_(ck);
  if(!v){
    if(!navigator.onLine) return '';
    try{
      let s = '';
      for(let i = 0; i < it.parts; i++){
        const d = await apiJson_({ action:'get', key:'catimg_' + it.id + '_' + i });
        if(!d || d.value == null) return '';
        s += d.value;
      }
      v = s; idbSet_(ck, v);
    }catch(e){ return ''; }
  }
  catImgMem_[ck] = v;
  return v;
}
function catHydrate_(root){
  const load = el=>{
    const it = catalog.find(c=>c.id === el.dataset.cid);
    catLimit_(()=>catGetImg_(it)).then(src=>{ if(src){ el.src = src; el.classList.add('on'); } });
  };
  const io = ('IntersectionObserver' in window)
    ? new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ io.unobserve(e.target); load(e.target); } }), { rootMargin:'300px' })
    : null;
  root.querySelectorAll('img[data-cid]').forEach(el=>{
    const it = catalog.find(c=>c.id === el.dataset.cid);
    const mem = it && catImgMem_[catKey_(it)];
    if(mem){ el.src = mem; el.classList.add('on'); }
    else if(io) io.observe(el); else load(el);
  });
}
function catEncode_(file){                    // shrinks the photo so it is light but still clear
  return new Promise((resolve, reject)=>{
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = ()=>{
      URL.revokeObjectURL(url);
      let side = 800, out = '';
      for(let k = 0; k < 4; k++){
        const sc = Math.min(1, side / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        out = c.toDataURL('image/jpeg', 0.72 - k * 0.07);
        if(out.length <= 130000) break;
        side = Math.round(side * 0.8);
      }
      resolve(out);
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error('image load failed')); };
    img.src = url;
  });
}
// Saves the photo INSIDE the Google Sheet (in small pieces). Nothing goes to Google Drive. Returns the number of pieces.
async function catUploadImg_(id, dataUrl){
  const b64 = dataUrl.split(',')[1] || '';
  const n = Math.max(1, Math.ceil(b64.length / CAT_CHUNK));
  const mk = i=>({ key:'catimg_' + id + '_' + i, value:(i === 0 ? 'data:image/jpeg;base64,' : '') + b64.slice(i * CAT_CHUNK, (i + 1) * CAT_CHUNK) });
  for(let i = 0; i < n; i++){
    let ok = false;
    for(let tries = 0; tries < 3 && !ok; tries++){
      try{ const j = await apiJson_(mk(i)); ok = !!(j && j.ok); }catch(e){ ok = false; }
    }
    if(!ok) throw new Error('SHEET_SAVE_FAILED');
  }
  try{                                                        // make sure the last piece really landed
    const d = await apiJson_({ action:'get', key:'catimg_' + id + '_' + (n - 1) });
    if(!d || d.value == null || d.value === '') throw new Error('x');
  }catch(e){ throw new Error('SHEET_SAVE_FAILED'); }
  return n;
}

/* ---- Reads the design number / size / rate printed on the photo and fills the empty boxes ---- */
let tessPromise_ = null;
function loadTesseract_(){
  if(window.Tesseract) return Promise.resolve();
  if(!tessPromise_) tessPromise_ = loadScriptOnce_('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js').catch(e=>{ tessPromise_ = null; throw e; });
  return tessPromise_;
}
function catCanvas_(file, maxSide){
  return new Promise((resolve, reject)=>{
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = ()=>{
      URL.revokeObjectURL(url);
      const sc = Math.min(1, maxSide / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); resolve(c);
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error('image load failed')); };
    img.src = url;
  });
}
function catParseTag_(text){
  const out = { name:'', sizes:'', rate:'' };
  // Old phones may not support look-behind in regex; fall back gracefully instead of crashing.
  const mk = (s, f)=>{ try{ return new RegExp(s, f); }catch(e){ return new RegExp(s.replace(/\(\?<![^)]*\)/g, ''), f); } };
  let work = String(text || '')
    .replace(/(\d)\s*[|]\s*(\d)/g, '$1/$2').replace(/[|]/g, ' ')
    .replace(/[—–]/g, '-').replace(/[\u2018\u2019]/g, "'");
  const SZW = '(?:XXS|XS|S|M|L|XL|XXL|XXXL|2XL|3XL|4XL|5XL)';
  const SZ = mk('(?<![\\dA-Z])(\\d{1,2}\\s*[\\/-]\\s*\\d{1,2}|' + SZW + '\\s*[\\/-]\\s*' + SZW + ')(?![\\dA-Z])', 'gi');
  const clean = x=>x.replace(/\s+/g, '').replace(/-/g, '/').toUpperCase();

  // ---- RATE ----
  // 1) the word RATE / Rs / MRP / price with the number after it (same line or next line)
  // 2) a number followed by "/-"   e.g. 543/-
  const rateRes = [
    mk('(?:\\brate|\\brs\\b\\.?|₹|\\bmrp|\\bprice)[\\s:.\\-=]*(?:rs\\.?|₹)?[\\s:.\\-=]*(\\d{2,5})(?!\\d)', 'i'),
    mk('(?<!\\d)(\\d{2,5})\\s*[\\/|l]\\s*-', 'i'),
    mk('@\\s*(\\d{2,5})(?!\\d)', 'i')
  ];
  for(const re of rateRes){
    const m = work.match(re);
    if(m){ out.rate = m[1]; work = work.replace(m[0], ' '); break; }
  }

  // ---- SIZE ----
  // numbers written after / below the word SIZE are the size; otherwise look for a size-looking pair anywhere
  let found = [];
  const m1 = work.match(mk('\\bsizes?\\b[\\s:.\\-=]*([^\\n]{0,40}(?:\\n[^\\n]{0,40})?)', 'i'));
  if(m1){
    found = (m1[1].match(SZ) || []).map(clean);
    if(!found.length){ const one = m1[1].match(/^\s*(\d{1,2})(?!\d)/); if(one) found = [one[1]]; }
  }
  if(!found.length) found = (work.match(SZ) || []).map(clean);
  out.sizes = [...new Set(found)].slice(0, 4).join(' ');
  found.forEach(f=>{ work = work.replace(new RegExp(f.split('/').join('\\s*[\\/-]\\s*'), 'i'), ' '); });
  work = work.replace(/\bsizes?\b\s*[:.\-=]?/ig, ' ');

  // ---- DESIGN NUMBER ----
  // Only the code itself — never the words around it. A "#" or the word Design/Article comes first;
  // otherwise the FIRST number/code written on the photo (reading order) is the design number.
  const fix = s=>{
    s = s.toUpperCase();
    if(/^[0-9OIL]{4,8}$/.test(s) && (s.match(/\d/g) || []).length >= 3) s = s.replace(/O/g, '0').replace(/[IL]/g, '1');
    return s.replace(/^[-\/.]+|[-\/.]+$/g, '');
  };
  const TOK = '([A-Z]{0,3}\\d[A-Z0-9]{1,9}(?:[-\\/][A-Z0-9]{1,6})?)';
  const okTok = s=>{
    const d = (s.match(/\d/g) || []).length, l = (s.match(/[A-Z]/g) || []).length;
    return s.length <= 16 && d <= 10 && (d >= 3 || (d >= 2 && l >= 1)) && !/^(19|20)\d\d$/.test(s);
  };
  const labelled = [
    mk('#\\s*' + TOK, 'i'),
    mk('\\b(?:design|desgn|dsn|d\\.?\\s*no|article|art|model|item|code|style)\\b\\.?\\s*(?:no\\.?|number|#|:|-|=)*\\s*' + TOK, 'i')
  ];
  for(const re of labelled){ const m = work.match(re); if(m && okTok(fix(m[1]))){ out.name = fix(m[1]); break; } }
  if(!out.name){
    const re = mk('(?<![A-Z0-9])' + TOK + '(?![A-Z0-9])', 'gi');
    let m;
    while((m = re.exec(work))){ const s = fix(m[1]); if(okTok(s)){ out.name = s; break; } }   // first one wins
  }
  return out;
}
// One shared OCR engine: reads the photo twice (scattered-text mode, then normal mode) and merges what it found.
let ocrWorker_ = null, ocrChain_ = Promise.resolve();
async function getOcrWorker_(){
  await loadTesseract_();
  if(!ocrWorker_) ocrWorker_ = await Tesseract.createWorker('eng');
  return ocrWorker_;
}
function catReadPhoto_(file){
  const job = ocrChain_.then(async ()=>{
    let w; try{ w = await getOcrWorker_(); }catch(e){ ocrWorker_ = null; throw e; }
    const cv = await catCanvas_(file, 1800);
    const merged = { name:'', sizes:'', rate:'' };
    for(const psm of ['11', '3']){
      await w.setParameters({ tessedit_pageseg_mode: psm });
      const r = await w.recognize(cv);
      const f = catParseTag_(r && r.data && r.data.text);
      ['name', 'sizes', 'rate'].forEach(k=>{ if(!merged[k] && f[k]) merged[k] = f[k]; });
      if(merged.name && merged.sizes && merged.rate) break;
    }
    return merged;
  });
  ocrChain_ = job.catch(()=>{});
  return job;
}
async function catAutoFill_(file){
  const box = gid_('catOcr'); if(!box) return;
  const nm = gid_('catName'), sz = gid_('catSizes'), rt = gid_('catRate');
  if(nm.value.trim() && sz.value.trim() && rt.value.trim()){ box.innerHTML = ''; return; }
  if(!navigator.onLine){ box.innerHTML = ''; return; }
  box.innerHTML = '<div class="msg info">🔍 Reading design number / size / rate from the photo…</div>';
  try{
    const f = await catReadPhoto_(file);
    if(catFile !== file || !gid_('catOcr')) return;           // photo was changed/closed meanwhile
    const got = [];
    if(!nm.value.trim() && f.name){ nm.value = f.name; got.push('Design'); }
    if(!sz.value.trim() && f.sizes){ sz.value = f.sizes; got.push('Size'); }
    if(!rt.value.trim() && f.rate){ rt.value = f.rate; got.push('Rate'); }
    gid_('catOcr').innerHTML = got.length
      ? `<div class="msg ok">✓ Auto-filled from photo: ${got.join(', ')} — please check once.</div>`
      : '<div class="msg info">Could not find the design number / size / rate on the photo — please type them.</div>';
  }catch(e){
    console.error('photo read failed', e);
    const b = gid_('catOcr'); if(b) b.innerHTML = '<div class="msg info">Could not read the photo automatically — please type the details.</div>';
  }
}
/* ---- Hide a design from specific customers (matched by name / mobile; stored only as scrambled codes, never as plain numbers) ---- */
function cyrb53_(str){
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for(let i = 0, ch; i < str.length; i++){ ch = str.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
}
function catNormName_(s){ return String(s || '').toLowerCase().replace(/[^a-z0-9\u0900-\u097f]/g, ''); }
function catNormMob_(s){ return String(s || '').replace(/\D/g, '').slice(-10); }
function catHashes_(name, mob, email){
  const n = catNormName_(name), m = catNormMob_(mob), em = String(email || '').trim().toLowerCase();
  return { nh: n ? cyrb53_('ssa-n|' + n) : '', mh: m.length >= 10 ? cyrb53_('ssa-m|' + m) : '', eh: /^[^@\s]+@[^@\s]+$/.test(em) ? cyrb53_('ssa-e|' + em) : '', tail: m.length >= 10 ? m.slice(-4) : '' };
}
function catHiddenFor_(c, who){
  if(!c || !c.hideFor || !c.hideFor.length) return false;
  const h = catHashes_(who && who.name, who && who.phone, who && who.email);
  return c.hideFor.some(e=>(e.eh && h.eh && e.eh === h.eh) || (e.mh && h.mh && e.mh === h.mh) || (e.nh && h.nh && e.nh === h.nh));
}
let catHideFor = [], catBulkHideFor = [];
function catHfArr_(w){ return w === 'b' ? catBulkHideFor : catHideFor; }
function catHfListHtml_(w){

}

function catHfAdd(w){
  const nm = gid_('catHfName_' + w), mb = gid_('catHfMob_' + w), ml = gid_('catHfMail_' + w), msg = gid_('catHfMsg_' + w);

/* ---------- Catalog orders ----------
   Customer saves an order -> it WAITS in "Cat. Pending" (customer sees it in Saved Orders).
   Accept  -> moves to "Cat. Dispatched"; it leaves the customer's Saved Orders and the customer gets an "accepted" notice.
   Reject  -> moves to the Deleted tab; the customer is NOT notified.
   All of it is stored and checked on the server (sheet "CatalogOrders"). */
let catAccepted = [];          // accepted catalog orders (shown in Cat. Dispatched)
let seenCatIds_ = null, lastInboxSig_ = null, custInit_ = false, cdSearch = '';
const acceptingCat_ = new Set();

function catApiName_(){

}

  catalogInbox = Array.isArray(x.pending) ? x.pending : [];
  if(Array.isArray(x.accepted)) catAccepted = x.accepted;

// Customer side: the server tells us once when an order was accepted
function catHandleAccepted_(list){
  let saved = []; try{ saved = JSON.parse(localStorage.getItem('ssa_cust_accepted') || '[]') || []; }catch(e){}
  list.forEach(o=>{

// Runs on every refresh: raises the new-order alert + badge and tells the screen when the lists changed.
async function importCatalogOrders_(){
  if(!currentStaff) return false;
  const sig = catalogInbox.map(o=>o && o.id).join(',') + '|' + catAccepted.map(o=>o && o.id).join(',');
  const changed = lastInboxSig_ !== null && sig !== lastInboxSig_;
  lastInboxSig_ = sig;
  if(!isCustomerUser_() && canAccessTab('catPending')){
    const pend = pendingCatOrders_();
    if(seenCatIds_ === null){ seenCatIds_ = new Set(pend.map(o=>o.id)); }
    else{
      pend.filter(o=>!seenCatIds_.has(o.id)).forEach(o=>{
        seenCatIds_.add(o.id);
        if(notifyOrders && Date.now() - new Date(o.createdAt).getTime() < 6 * 3600 * 1000){
          showOrderNotification_(t('new_order_title'), `${o.customerName} · ${totalsUi_(catLinesItems_(o))} · Catalog`, 'ssa-co-' + o.id);
        }
      });
    }
  }
  updateCatBadge_();
  return changed;
}

async function decideCat_(id, decision){
  if(!canAccessTab('catPending') || acceptingCat_.has(id)) return null;
  if(!navigator.onLine){ alert('Internet is needed to accept or reject an order.'); return null; }
  const o = catalogInbox.find(x=>x && x.id === id);
  if(!o) return null;
  acceptingCat_.add(id);
  try{
    const r = await apiJson_({ action:'decideOrder', id, decision });
    if(!r || !r.ok){
      alert(r && r.code === 'conflict' ? 'Someone else has already handled this order.' : ((r && r.error) || 'Could not save — please check your internet and try again.'));
      silentRefresh_();
      return null;
    }
    catalogInbox = catalogInbox.filter(x=>x.id !== id);
    return r.order || o;
  }finally{ acceptingCat_.delete(id); }
}

async function acceptCatalogOrder(id){
  markBusy(t('processing_word'));
  const o = await decideCat_(id, 'accept');
  if(!o){ render(); return; }
  catAccepted = [o].concat(catAccepted.filter(x=>x.id !== o.id));
  await logActivity('Catalog Order Accepted', `${o.customerName} (${(o.lines||[]).length} design)`);
  render();
}

async function rejectCatalogOrder(id){
  const o0 = catalogInbox.find(x=>x && x.id === id);
  if(!o0) return;
  if(!confirm(`Reject this order from ${o0.customerName}?\nIt will move to the Deleted tab. The customer will NOT be notified.`)) return;
  markBusy(t('processing_word'));
  const o = await decideCat_(id, 'reject');
  if(!o){ render(); return; }
  const now = new Date().toISOString();
  const by = currentStaff ? { name:currentStaff.name, mobile:currentStaff.mobile } : null;
  const have = new Set(bookings.map(b=>b.id));
  (o.lines || []).forEach((l, i)=>{
    const rid = 'cat_' + o.id + '_' + i;
    if(have.has(rid)) return;
    bookings.push({
      id:rid, customerName:String(o.customerName || 'Catalog Customer'), city:o.city || '',
      brand:String(l.brand || 'Catalog Order'), designNumber:String(l.design), colour:l.colour || '',
      size:String(l.size), qty:Number(l.qty) || 1, unit:unitOf_(l),
      pricePerPcs:l.rate ? String(l.rate) : '', status:'pending', orderedAt:o.createdAt, dispatchedAt:null,
      orderedBy:{ name:'Catalog (Customer)', mobile:'' }, fromCatalog:true, catItemId:l.itemId || '',
      custPhone:o.phone || '', custEmail:o.email || '', note:o.note || '',
      trashed:true, trashedAt:now, trashedBy:by, rejectedCatalog:true
    });
    if(seenBookingIds_) seenBookingIds_.add(rid);
  });
  await saveData();
  await logActivity('Catalog Order Rejected', `${o.customerName} (${(o.lines||[]).length} design)`);
  render();
}

/* ---------- Dashboard ---------- */
let dashPeriod = 'today', dashTab = 'both', dashRange = 7, dashMetric = 'qty', dashTrend = 'qty';
const DASH_PERIODS = [['today','Today'],['yesterday','Yesterday'],['week','This Week'],['month','This Month'],['fy','This Financial Year'],['all','All Time']];
function dashRanges_(p){
  const D = 86400000, now = new Date(), today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  let s, e, ps = null, pe = null;
  if(p === 'today'){ s = today; e = new Date(+today + D); ps = new Date(+today - D); pe = today; }
  else if(p === 'yesterday'){ s = new Date(+today - D); e = today; ps = new Date(+today - 2 * D); pe = s; }
  else if(p === 'week'){ const dow = (today.getDay() + 6) % 7; s = new Date(+today - dow * D); e = new Date(+s + 7 * D); ps = new Date(+s - 7 * D); pe = s; }
  else if(p === 'month'){ s = new Date(today.getFullYear(), today.getMonth(), 1); e = new Date(today.getFullYear(), today.getMonth() + 1, 1); ps = new Date(today.getFullYear(), today.getMonth() - 1, 1); pe = s; }
  else if(p === 'fy'){ const fy = today.getMonth() >= 3 ? today.getFullYear() : today.getFullYear() - 1; s = new Date(fy, 3, 1); e = new Date(fy + 1, 3, 1); ps = new Date(fy - 1, 3, 1); pe = s; }
  else { s = new Date(0); e = new Date(8.64e15); }
  return { s, e, ps, pe };
}
function dashSets_(s, e){
  const inR = iso=>{ if(!iso) return false; const x = +new Date(iso); return x >= +s && x < +e; };
  const live = bookings.filter(b=>!b.trashed);
  return {
    ord: live.filter(b=>inR(b.orderedAt)),
    dis: live.filter(b=>b.status === 'dispatched' && inR(b.dispatchedAt)),
    del: bookings.filter(b=>b.trashed && inR(b.trashedAt)),
    inR
  };
}
const sumQ_ = a=>a.reduce((x, b)=>x + (Number(b.qty) || 0), 0);
function pctHtml_(cur, prev){
  if(prev == null) return '';
  if(!prev) return cur ? '<span class="up">▲ new</span>' : '';
  const p = Math.round((cur - prev) / prev * 100);
  return p === 0 ? '' : `<span class="${p > 0 ? 'up' : 'dn'}">${p > 0 ? '▲' : '▼'} ${Math.abs(p)}%</span>`;
}
function dashTop_(rows, keyFn){
  const m = {};
  rows.forEach(b=>{ const k = keyFn(b); if(!k) return; m[k] = (m[k] || 0) + (dashTrend === 'lines' ? 1 : (Number(b.qty) || 0)); });
  const arr = Object.entries(m).sort((a, b)=>b[1] - a[1]).slice(0, 5);
  if(!arr.length) return '<div class="subtle" style="padding:14px 0">No data for this period</div>';
  const mx = arr[0][1] || 1;
  return arr.map(([k, v])=>`<div class="trow"><div><span>${escapeHtml(k)}</span><b>${v}</b></div><div class="tbar"><i style="width:${Math.max(4, v / mx * 100)}%"></i></div></div>`).join('');
}
function dashChart_(){
  const D = 86400000, n = dashRange, now = new Date(), today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const days = [];
  for(let i = n - 1; i >= 0; i--) days.push(new Date(+today - i * D));
  const live = bookings.filter(b=>!b.trashed);
  const val = a=>dashMetric === 'lines' ? a.length : sumQ_(a);
  const data = days.map(d=>{
    const s = +d, e = s + D;
    const inR = iso=>{ if(!iso) return false; const x = +new Date(iso); return x >= s && x < e; };
    return { d, o:val(live.filter(b=>inR(b.orderedAt))), x:val(live.filter(b=>b.status === 'dispatched' && inR(b.dispatchedAt))) };
  });
  const mx = Math.max(1, ...data.map(r=>dashTab === 'ord' ? r.o : dashTab === 'dis' ? r.x : Math.max(r.o, r.x)));
  const step = n > 14 ? 5 : 1;
  return `<div class="chart">${data.map((r, i)=>`
    <div class="bcol"><div class="bpair">
      ${dashTab !== 'dis' ? `<div class="bar" style="height:${r.o / mx * 100}%" title="Orders: ${r.o}"></div>` : ''}
      ${dashTab !== 'ord' ? `<div class="bar d" style="height:${r.x / mx * 100}%" title="Dispatched: ${r.x}"></div>` : ''}
    </div><div class="blab">${(n - 1 - i) % step === 0 ? r.d.getDate() + '/' + (r.d.getMonth() + 1) : ''}</div></div>`).join('')}</div>
    <div class="legend">${dashTab !== 'dis' ? '<span><i></i>Orders</span>' : ''}${dashTab !== 'ord' ? '<span><i class="d"></i>Dispatched</span>' : ''}</div>`;
}
function renderDashboard(main){
  const R = dashRanges_(dashPeriod);
  const cur = dashSets_(R.s, R.e);
  const prev = R.ps ? dashSets_(R.ps, R.pe) : null;
  const live = bookings.filter(b=>!b.trashed);
  const pending = live.filter(b=>b.status === 'pending');
  const custAll = new Set(live.map(b=>b.customerName));
  const firstOrder = {};
  live.forEach(b=>{ const x = +new Date(b.orderedAt); if(!(b.customerName in firstOrder) || x < firstOrder[b.customerName]) firstOrder[b.customerName] = x; });
  const custPeriod = new Set(cur.ord.map(b=>b.customerName));
  const custNew = [...custPeriod].filter(c=>firstOrder[c] >= +R.s && firstOrder[c] < +R.e);
  const addedDesigns = catalog.filter(c=>cur.inR(c.createdAt)).length;
  const st = (label, value, extra)=>`<div class="dstat"><small>${label}</small><b>${value}</b>${extra || ''}</div>`;
  const lastSync = lastSyncAt_ ? lastSyncAt_.toLocaleString('en-IN', { month:'short', day:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit', second:'2-digit' }) : '—';
  const trendRows = cur.ord;
  main.innerHTML = `
    <div class="dash-bar"><span>Last sync: ${lastSync}</span><button class="btn-pill" onclick="dashRefresh_()">⟳ Refresh</button></div>
    <div class="dash-hero">
      <div class="dash-head"><h2>Business Overview</h2>
        <select class="pill-select" onchange="dashPeriod=this.value;render()">${DASH_PERIODS.map(p=>`<option value="${p[0]}" ${p[0] === dashPeriod ? 'selected' : ''}>${p[1]}</option>`).join('')}</select></div>
      <div class="dash-grid">
        <div class="dcard span2"><div class="dtitle"><i>📋</i>Sales Department</div><div class="dstats">
          ${st('Orders', totalsShort_(cur.ord), pctHtml_(sumQ_(cur.ord), prev ? sumQ_(prev.ord) : null))}
          ${st('Dispatched', totalsShort_(cur.dis), pctHtml_(sumQ_(cur.dis), prev ? sumQ_(prev.dis) : null))}
          ${st('Pending (now)', totalsShort_(pending))}
          ${st('Deleted', totalsShort_(cur.del))}</div></div>
        <div class="dcard"><div class="dtitle"><i>👤</i>Customers</div><div class="dstats">
          ${st('Ordered', custPeriod.size)}${st('New', custNew.length)}${st('Total', custAll.size)}</div></div>
        <div class="dcard"><div class="dtitle"><i>🖼️</i>Catalog</div><div class="dstats">
          ${st('Designs', catalog.length)}${st('Added', addedDesigns)}${st('Hidden', catalog.filter(c=>c.hidden).length)}</div></div>
        <div class="dcard"><div class="dtitle"><i>⏳</i>Total Pending Orders</div><div class="dstats">
          ${st('In Quantity', totalsUi_(pending))}${st('Customers', new Set(pending.map(b=>b.customerName)).size)}</div></div>
      </div>
    </div>

let pubSendErr_ = '';
// The server saves the order itself (one safe step) — no more read-modify-write of a shared list on the phone.
async function pubSendOrder_(order){
  const sleep = ms=>new Promise(r=>setTimeout(r, ms));
  pubSendErr_ = '';
  for(let attempt = 0; attempt < 3; attempt++){
    const j = await apiJson_({ action:'placeOrder', order });
    if(j && j.ok) return true;
    if(j && (j.code === 'bad_request' || j.code === 'limit' || j.code === 'forbidden')){ pubSendErr_ = j.error || ''; return false; }
    await sleep(800);
  }
  return false;
}
function pubOrderRows_(order){
  return order.lines.map(l=>({ designNumber:l.design, colour:l.colour || '', size:l.size, brand:l.brand || '', qty:l.qty, unit:l.unit, pricePerPcs:l.rate ? String(l.rate) : '' }));
}
const pubThumb_ = {};
function pubShrink_(src){
  return new Promise(res=>{
    const im = new Image();
    im.onload = ()=>{
      const sc = Math.min(1, 160 / im.height), c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(im.width * sc)); c.height = Math.max(1, Math.round(im.height * sc));
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      res({ d:c.toDataURL('image/jpeg', 0.7), w:c.width, h:c.height });
    };
    im.onerror = ()=>res(null);
    im.src = src;
  });
}
async function pubLoadThumbs_(order){
  const items = [...new Set(order.lines.map(l=>l.itemId))].map(id=>catalog.find(c=>c.id === id)).filter(Boolean);
  const need = items.filter(it=>it.fileId && !pubThumb_[it.id]);
  if(need.length && navigator.onLine){
    try{
      const res = await postToSheet_({ action:'getCatalogImages', fileIds:need.map(i=>i.fileId) });
      const d = await res.json();
      if(d && d.ok && d.images){ for(const it of need){ if(d.images[it.fileId]) pubThumb_[it.id] = await pubShrink_(d.images[it.fileId]); } }
    }catch(e){ console.error('thumbnails for PDF failed', e); }
  }
  for(const it of items.filter(i=>!i.fileId && i.parts && !pubThumb_[i.id])){
    try{ const src = await catGetImg_(it); if(src) pubThumb_[it.id] = await pubShrink_(src); }catch(e){}
  }
  return pubThumb_;
}
async function pubPdf_(order){
  const rows = pubOrderRows_(order), hdr = unitHdr_(rows);
  const tableRows = rows.map(b=>[b.designNumber, b.colour || '-', b.size, b.brand || '-', qtyCell_(b, hdr)]);
  const pp = pdfWithPrice_(['Design Number', 'Colour', 'Size', 'Brand', hdr], tableRows, rows, hdr);
  const sub = 'Catalog Order' + (order.city ? '   |   ' + order.city : '') + (order.phone ? '   |   Ph: ' + order.phone : '');
  let cols = pp.columns, trs = pp.tableRows;
  const extra = { heading:'Order' };
  let thumbs = {};
  try{ thumbs = await pubLoadThumbs_(order); }catch(e){}
  const imgs = order.lines.map(l=>thumbs[l.itemId] || null);
  if(imgs.some(Boolean)){                       // small catalog photo in the first column
    cols = ['Photo'].concat(cols); trs = trs.map(r=>[''].concat(r));
    extra.columnStyles = { 0:{ cellWidth:16 } };
    extra.styles = { valign:'middle' };
    extra.didParseCell = d=>{ if(d.section === 'body' && d.column.index === 0) d.cell.styles.minCellHeight = 19; };
    extra.didDrawCell = d=>{
      if(d.section !== 'body' || d.column.index !== 0) return;
      const im = imgs[d.row.index]; if(!im) return;
      const k = Math.min(14 / im.w, 17 / im.h), w = im.w * k, h = im.h * k;
      d.doc.addImage(im.d, 'JPEG', d.cell.x + (d.cell.width - w) / 2, d.cell.y + (d.cell.height - h) / 2, w, h);
    };
  }
  const blob = buildPdfBlob(order.customerName, sub, cols, trs, `${t('total')}: ${totalsPdf_(rows)}${amtFooter_(pp)}`, extra);
  return { blob, name:`Order_${pdfNamePart_(order.customerName, false) || 'CUSTOMER'}.pdf`, rows };
}
async function pubShowPdf_(order){
  pubToast_('Preparing PDF…');
  const p = await pubPdf_(order);
  if(!p.blob){ alert('Could not create the PDF. Please check your internet connection and try again.'); return; }
  showPdfActions_(p.blob, p.name, `Order — ${order.customerName}`, `Order — ${order.customerName}, ${t('total')} ${totalsUi_(p.rows)}`);
}
async function pubSubmit_(){
  const setMsg = h=>{ const m = gid_('pubMsg'); if(m){ m.innerHTML = h ? `<div class="msg err">${h}</div>` : ''; m.scrollIntoView({ block:'nearest' }); } };
  const name = gid_('pubName').value.trim(), city = gid_('pubCity').value.trim(), phone = gid_('pubPhone').value.trim(), note = gid_('pubNote').value.trim();
  try{ localStorage.setItem('ssa_pub_cust', JSON.stringify({ name, city, phone })); }catch(e){}
  if(!pubCart.length) return setMsg('Please add at least one design to your order');
  const lines = [];
  for(const ent of pubCart){
    const it = catalog.find(c=>c.id === ent.id); if(!it) continue;
    for(const r of ent.rows){
      const size = String(r.size).trim(), qty = parseInt(r.qty, 10);
      if(!size) return setMsg(`Design <b>${escapeHtml(it.name)}</b>: please write the size`);
      if(!(qty > 0)) return setMsg(`Design <b>${escapeHtml(it.name)}</b>: please enter the Set / Pcs quantity`);
      lines.push({ itemId:it.id, design:it.name, brand:it.brand || '', colour:'', size, qty, unit:unitOf_(r), rate:catRate_(it) || '' });
    }
  }
  if(!lines.length) return setMsg('Your order is empty');
  if(!name) return setMsg('Please enter your name');
  if(!navigator.onLine || !cloudAvailable) return setMsg('Internet connection is needed to send the order. Your selection is saved — please try again when online.');
  const btn = gid_('pubSaveBtn'); btn.disabled = true; btn.textContent = 'Saving order…';
  const order = { id:'co' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), customerName:name, city, phone, note, createdAt:new Date().toISOString(), lines, email:String(isCustomerUser_() ? currentStaff.mobile : ((pubDev_() || pubId_() || {}).email || '')).toLowerCase() };
  const ok = await pubSendOrder_(order);
  if(!ok){ btn.disabled = false; btn.textContent = 'Save Order & Get PDF'; return setMsg(escapeHtml(pubSendErr_) || 'Order could not be sent. Please check your internet and press Save again.'); }
  try{ sendOrderPush_(name, '', totalsPdf_(pubOrderRows_(order)), order.createdAt); }catch(e){}
  try{ if(!catalogInbox.some(o=>o.id === order.id)) catalogInbox.push(order); }catch(e){}   // shows in Saved Orders straight away
  pubLastOrder = order; pubCart = []; pubSave_(); pubGrid_(); pubFab_();
  const ov = gid_('pubSheet');
  ov.innerHTML = `<div class="modal-sheet" style="text-align:center">
    <div style="font-size:46px">✅</div><h2 style="margin:6px 0">Order saved!</h2>
    <div class="subtle" style="margin-bottom:14px">${escapeHtml(name)}, your order has been sent to ${escapeHtml(COMPANY_NAME)}.</div>
    <button class="primary" onclick="pubShowPdf_(pubLastOrder)">📄 Get Order PDF</button>
    ${isCustomerUser_() ? `<button class="secondary" style="margin-top:8px" onclick="pubCloseSheet_();goTab_('custOrders')">📑 My Saved Orders</button>` : ''}
    <button class="secondary" style="margin-top:8px" onclick="pubCloseSheet_()">Back to catalog</button></div>`;
  pubShowPdf_(order);
}

function bkStamp_(){ const d = new Date(), p = n=>String(n).padStart(2, '0'); return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes()); }

function bkDownload_(blob, name){

function bkTable_(arr){
  const keys = [], seen = {};
  (arr || []).forEach(o=>Object.keys(o || {}).forEach(k=>{ if(!seen[k]){ seen[k] = 1; keys.push(k); } }));
  if(!keys.length) return [['(no data)']];
  const flat = v=>(v && typeof v === 'object') ? JSON.stringify(v) : (v === undefined || v === null ? '' : v);
  return [keys].concat(arr.map(o=>keys.map(k=>flat((o || {})[k]))));
}

// Restore = ADD what is missing. Nothing that already exists is changed or removed.
async function bkRestoreFile(file){
  if(!file) return;
  if(!isOwnerUser_()){ alert(BT_('Only the owner can restore a backup.','सिर्फ ओनर बैकअप रिस्टोर कर सकता है।')); return; }
  let d; try{ d = JSON.parse(await file.text()); }catch(e){ d = null; }
  if(!d || d.app !== BK_APP || !Array.isArray(d.bookings)){ bkMsg_(`<div class="msg err">${BT_('This is not a valid backup file.','यह सही बैकअप फाइल नहीं है।')}</div>`); return; }
  const ids = arr=>new Set(arr.map(x=>x && x.id));
  const hb = ids(bookings), hc = ids(catalog), ha = ids(activityLog);
  const hs = new Set(staffApprovals.map(x=>String(x.email || '').toLowerCase()));
  const nb = d.bookings.filter(x=>x && x.id && !hb.has(x.id));
  const nc = (d.catalog || []).filter(x=>x && x.id && !hc.has(x.id));
  const na = (d.activityLog || []).filter(x=>x && x.id && !ha.has(x.id));
  const ns = (d.staff || []).filter(x=>x && x.email && !hs.has(String(x.email).toLowerCase()) && !isOwnerEmail_(x.email));
  const hi = new Set(acctInvoices.map(x=>x.id)), hp = new Set(acctParties.map(x=>x.id));
  const ni = (d.acctInvoices || []).filter(x=>x && x.id && !hi.has(x.id)), np = (d.acctParties || []).filter(x=>x && x.id && !hp.has(x.id));
  const photos = d.photos || {};
  const withPhoto = nc.filter(c=>photos[c.id]).length;
  if(withPhoto && !navigator.onLine){ bkMsg_(`<div class="msg err">${BT_('Internet is needed to restore photos.','फोटो रिस्टोर करने के लिए इंटरनेट चाहिए।')}</div>`); return; }
  const when = d.createdAt ? new Date(d.createdAt).toLocaleString() : '';
  if(!confirm(`${BT_('Restore from backup','बैकअप से रिस्टोर')} (${when})?\n\n${BT_('Will ADD (existing data is not changed)','जुड़ेगा (मौजूदा डेटा नहीं बदलेगा)')}:\n• ${nb.length} ${BT_('orders','ऑर्डर')}\n• ${nc.length} ${BT_('catalog designs','कैटलॉग डिज़ाइन')} (${withPhoto} ${BT_('with photo','फोटो के साथ')})\n• ${na.length} ${BT_('activity entries','एक्टिविटी')}\n• ${ns.length} ${BT_('staff / customers','स्टाफ / कस्टमर')}\n• ${ni.length} ${BT_('sale / purchase entries','सेल / परचेज एंट्री')}`)) return;
  markBusy(t('processing_word'));
  try{
    if(nb.length){ bookings = bookings.concat(nb); await saveData(); }
    if(na.length){ activityLog = activityLog.concat(na).sort((a, b)=>String(b.timestamp || '') < String(a.timestamp || '') ? -1 : 1); await saveActivity(); }
    let photoFail = 0;
    if(nc.length){
      let k = 0;
      for(const c of nc){
        k++; bkMsg_(`<div class="msg">${BT_('Restoring designs','डिज़ाइन रिस्टोर हो रहे हैं')} ${k}/${nc.length}…</div>`);
        const it = Object.assign({}, c);
        if(photos[c.id]){
          try{ const n = await catUploadImg_(it.id, photos[c.id]); it.parts = n; it.imgV = Date.now(); delete it.fileId; }
          catch(e){ photoFail++; it.parts = 0; delete it.fileId; }
        }else if(it.parts || it.fileId){ it.parts = 0; delete it.fileId; }
        catalog.push(it);
      }
      catalog.sort((a, b)=>String(b.createdAt || '') < String(a.createdAt || '') ? -1 : 1);
      await saveCatalog();
    }
    if(ns.length){ staffApprovals = staffApprovals.concat(ns); await saveApprovals(); }
    if(ni.length || np.length){ acctInvoices = acctInvoices.concat(ni); acctParties = acctParties.concat(np); acctSave_(); }
    const bz = d.business;
    if(bz && bz.name && (!bizProfile.name || confirm(BT_('Also replace the current business name, address, logo and units with the ones in the backup?','मौजूदा बिज़नेस नाम, पता, लोगो और यूनिट को बैकअप वाले से भी बदलें?')))){
      const p = { v:1, name:String(bz.name).slice(0, 60), address:String(bz.address || '').slice(0, 200), contact:String(bz.contact || '').slice(0, 120), logo:bz.logo || '', logoAR:bz.logoAR || 1, units:Array.isArray(bz.units) ? bz.units : UNIT_DEFAULT_ENABLED.slice(), custom:Array.isArray(bz.custom) ? bz.custom : [], gst:bz.gst || null };
      bizApply_(p); await storageSet('companyProfile', JSON.stringify(p));
    }
    try{ await logActivity('Backup Restored', `${nb.length} orders, ${nc.length} designs`); }catch(e){}
    render();
    bkMsg_(`<div class="msg ok">✅ ${BT_('Restored','रिस्टोर हुआ')}: ${nb.length} ${BT_('orders','ऑर्डर')}, ${nc.length} ${BT_('designs','डिज़ाइन')}, ${ns.length} ${BT_('staff/customers','स्टाफ/कस्टमर')}.${photoFail ? ` ${photoFail} ${BT_('photos could not be saved — add them again.','फोटो सेव नहीं हुए — दोबारा जोड़ें।')}` : ''}</div>`);
  }catch(e){ console.error('restore failed', e); bkMsg_(`<div class="msg err">${BT_('Restore stopped midway. Nothing was removed; you can try again.','रिस्टोर बीच में रुक गया। कुछ भी हटा नहीं है; दोबारा कोशिश कर सकते हैं।')}</div>`); }
}

/* ======= GST ENGINE ======= */
/* =====================================================================
   GST ENGINE  (pure calculation code — no screens).  Used by the Sale / Purchase tab.
   Rules used (checked July-Nov 2026 sources):
   - Regular : tax invoice, GSTR-1 + GSTR-3B.   Composition : bill of supply, CMP-08 (quarterly) + GSTR-4 (annual), no ITC.
   - Unregistered : bill of supply, no GST returns.
   - GSTR-1: inter-state sale to an unregistered buyer above Rs 1,00,000 per invoice = B2CL (invoice-wise, from Aug 2024);
             everything else to unregistered buyers = B2CS (state + rate wise). HSN summary is split B2B / B2C (from May 2025).
   - Rates now: 0, 5, 18, 40 (+3 gold/silver, 0.25 rough diamonds). 12 / 28 only for documents dated before 22-Sep-2025.
   ===================================================================== */
const GST_STATES = {'01':'Jammu & Kashmir','02':'Himachal Pradesh','03':'Punjab','04':'Chandigarh','05':'Uttarakhand','06':'Haryana','07':'Delhi','08':'Rajasthan','09':'Uttar Pradesh','10':'Bihar','11':'Sikkim','12':'Arunachal Pradesh','13':'Nagaland','14':'Manipur','15':'Mizoram','16':'Tripura','17':'Meghalaya','18':'Assam','19':'West Bengal','20':'Jharkhand','21':'Odisha','22':'Chhattisgarh','23':'Madhya Pradesh','24':'Gujarat','26':'Dadra & Nagar Haveli and Daman & Diu','27':'Maharashtra','29':'Karnataka','30':'Goa','31':'Lakshadweep','32':'Kerala','33':'Tamil Nadu','34':'Puducherry','35':'Andaman & Nicobar Islands','36':'Telangana','37':'Andhra Pradesh','38':'Ladakh','97':'Other Territory','99':'Centre Jurisdiction'};
const GST_RATES = [0, 0.25, 3, 5, 12, 18, 28, 40];
const B2CL_LIMIT = 100000;
const UQC_MAP = { set:'SET', pcs:'PCS', box:'BOX', dozen:'DOZ', pair:'PRS', carton:'CTN', bundle:'BDL', packet:'PAC', bag:'BAG', roll:'ROL', kg:'KGS', meter:'MTR', litre:'LTR', bottle:'BTL' };
function round2_(n){ return Math.round((Number(n) || 0) * 100) / 100; }
function gstinValid_(g){
  g = String(g || '').trim().toUpperCase();
  if(!/^\d{2}[A-Z]{5}\d{4}[A-Z][1-9A-Z]Z[0-9A-Z]$/.test(g) || !GST_STATES[g.slice(0, 2)]) return false;
  const cs = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ'; let sum = 0;
  for(let i = 0; i < 14; i++){ const p = cs.indexOf(g[i]) * (i % 2 === 0 ? 1 : 2); sum += Math.floor(p / 36) + (p % 36); }
  return g[14] === cs[(36 - (sum % 36)) % 36];
}
function posLabel_(code){ return code && GST_STATES[code] ? code + '-' + GST_STATES[code] : (code || ''); }
function uqcOf_(unit){ return UQC_MAP[unit] || 'OTH'; }

// Works out taxable value, CGST/SGST or IGST and the round-off of ONE invoice (fills the fields on the invoice).
function calcInvoice_(inv, firm){
  const type = (firm && firm.type) || 'regular', firmState = (firm && firm.state) || '';
  const isSale = inv.kind !== 'purchase';
  const sellerState = isSale ? firmState : (inv.partyState || '');
  const pos = inv.pos || (isSale ? (inv.partyState || firmState) : firmState);
  const intra = !!sellerState && sellerState === pos;
  const chargeTax = isSale ? type === 'regular' : true;      // a composition / unregistered seller never charges GST; a purchase carries what the supplier charged
  const groups = {}; let taxable = 0;
  (inv.lines || []).forEach(l=>{
    const gross = (Number(l.qty) || 0) * (Number(l.rate) || 0);
    const tv = round2_(gross - gross * ((Number(l.disc) || 0) / 100));
    const rate = chargeTax ? (Number(l.gst) || 0) : 0;
    l._tv = tv; l._rate = rate;
    groups[rate] = round2_((groups[rate] || 0) + tv); taxable = round2_(taxable + tv);
  });
  let cgst = 0, sgst = 0, igst = 0;
  Object.keys(groups).forEach(k=>{
    const r = Number(k);
    if(intra){ const h = round2_(groups[k] * r / 200); cgst = round2_(cgst + h); sgst = round2_(sgst + h); }
    else igst = round2_(igst + groups[k] * r / 100);
  });
  const sub = round2_(taxable + cgst + sgst + igst), total = Math.round(sub);
  Object.assign(inv, { taxable, cgst, sgst, igst, roundOff:round2_(total - sub), total, intra, pos, groups });
  return inv;
}
function lineTax_(inv, l){                      // tax of a single line (for the HSN table)
  const r = l._rate || 0, tv = l._tv || 0;
  return inv.intra ? { igst:0, cgst:tv * r / 200, sgst:tv * r / 200 } : { igst:tv * r / 100, cgst:0, sgst:0 };
}
function inPeriod_(inv, from, to){ return inv.date >= from && inv.date <= to; }
function fyOf_(dateStr){ const y = +dateStr.slice(0, 4), m = +dateStr.slice(5, 7); const s = m >= 4 ? y : y - 1; return { start:s + '-04-01', end:(s + 1) + '-03-31', label:s + '-' + String(s + 1).slice(2) }; }
function nextInvoiceNo_(invoices, kind, date){
  const fy = fyOf_(date).label, prefix = (kind === 'credit_note' ? 'CN/' : kind === 'purchase' ? 'PUR/' : 'INV/') + fy + '/';
  let max = 0;
  invoices.forEach(i=>{ if(i.kind === kind && String(i.no || '').startsWith(prefix)){ const n = parseInt(String(i.no).slice(prefix.length), 10); if(n > max) max = n; } });
  return prefix + String(max + 1).padStart(4, '0');
}
function rupeesInWords_(amount){
  const a = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten', 'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'];
  const b = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];
  const two = n=>n < 20 ? a[n] : b[Math.floor(n / 10)] + (n % 10 ? ' ' + a[n % 10] : '');
  const three = n=>(n >= 100 ? a[Math.floor(n / 100)] + ' Hundred' + (n % 100 ? ' ' : '') : '') + (n % 100 ? two(n % 100) : '');
  let n = Math.round(Math.abs(amount)); if(n === 0) return 'Rupees Zero Only';
  const parts = [], cr = Math.floor(n / 10000000), lk = Math.floor(n / 100000) % 100, th = Math.floor(n / 1000) % 100, rest = n % 1000;
  if(cr) parts.push(three(cr) + ' Crore'); if(lk) parts.push(two(lk) + ' Lakh'); if(th) parts.push(two(th) + ' Thousand'); if(rest) parts.push(three(rest));
  return 'Rupees ' + parts.join(' ') + ' Only';
}

/* ---------------------------- GSTR-1 ---------------------------- */
function gstr1Build_(invs, firm, from, to){
  const R = { b2b:[], b2cl:[], b2cs:{}, cdnr:[], cdnur:[], nil:{ interReg:0, intraReg:0, interUnreg:0, intraUnreg:0 }, hsnB2B:{}, hsnB2C:{}, docs:[], warnings:[], totals:{ taxable:0, igst:0, cgst:0, sgst:0 } };
  const sel = invs.filter(i=>(i.kind === 'sale' || i.kind === 'credit_note') && inPeriod_(i, from, to));
  const live = sel.filter(i=>i.status !== 'cancelled');
  live.forEach(inv=>{
    const sign = inv.kind === 'credit_note' ? -1 : 1, reg = gstinValid_(inv.partyGstin), inter = !inv.intra;
    const rows = Object.keys(inv.groups || {}).map(Number).sort((x, y)=>x - y).map(rate=>{
      const tv = inv.groups[rate], r = inv.intra ? { cgst:round2_(tv * rate / 200), sgst:round2_(tv * rate / 200), igst:0 } : { igst:round2_(tv * rate / 100), cgst:0, sgst:0 };
      return { rate, taxable:tv, igst:r.igst, cgst:r.cgst, sgst:r.sgst };
    });
    if(inv.partyGstin && !reg) R.warnings.push(`${inv.no}: GSTIN "${inv.partyGstin}" is not valid — treated as an unregistered buyer.`);
    rows.forEach(x=>{ if(x.rate === 0){ const k = (inter ? 'inter' : 'intra') + (reg ? 'Reg' : 'Unreg'); R.nil[k] = round2_(R.nil[k] + sign * x.taxable); } });
    const taxed = rows.filter(x=>x.rate > 0);
    const rec = { gstin:reg ? inv.partyGstin.toUpperCase() : '', party:inv.partyName || '', no:inv.no, date:inv.date, value:inv.total * sign, pos:inv.pos, rows:taxed.map(x=>({ ...x })) };
    const addB2cs = sg=>taxed.forEach(x=>{ const k = inv.pos + '|' + x.rate; const o = R.b2cs[k] || (R.b2cs[k] = { pos:inv.pos, rate:x.rate, taxable:0, igst:0, cgst:0, sgst:0 }); o.taxable = round2_(o.taxable + sg * x.taxable); o.igst = round2_(o.igst + sg * x.igst); o.cgst = round2_(o.cgst + sg * x.cgst); o.sgst = round2_(o.sgst + sg * x.sgst); });
    if(inv.kind === 'sale'){
      if(taxed.length){
        if(reg) R.b2b.push(rec);
        else if(inter && inv.total > B2CL_LIMIT) R.b2cl.push(rec);
        else addB2cs(1);
      }
    } else if(taxed.length){
      const note = { ...rec, refNo:inv.refNo || '', refDate:inv.refDate || '' };
      if(reg) R.cdnr.push(note);
      else if(inter && inv.total > B2CL_LIMIT) R.cdnur.push(note);
      else addB2cs(-1);
    }
    (inv.lines || []).forEach(l=>{
      if(!l.hsn) R.warnings.push(`${inv.no}: HSN missing for "${l.desc || 'item'}" (needed in GSTR-1 Table 12).`);
      const T = reg ? R.hsnB2B : R.hsnB2C, uqc = uqcOf_(l.unit), k = [l.hsn || '', uqc, l._rate].join('|'), tx = lineTax_(inv, l);
      const o = T[k] || (T[k] = { hsn:l.hsn || '', desc:l.desc || '', uqc, rate:l._rate, qty:0, value:0, taxable:0, igst:0, cgst:0, sgst:0 });
      o.qty = round2_(o.qty + sign * (Number(l.qty) || 0)); o.taxable = round2_(o.taxable + sign * l._tv);
      o.igst = round2_(o.igst + sign * tx.igst); o.cgst = round2_(o.cgst + sign * tx.cgst); o.sgst = round2_(o.sgst + sign * tx.sgst);
      o.value = round2_(o.taxable + o.igst + o.cgst + o.sgst);

    R.totals.igst = round2_(R.totals.igst + sign * inv.igst); R.totals.cgst = round2_(R.totals.cgst + sign * inv.cgst); R.totals.sgst = round2_(R.totals.sgst + sign * inv.sgst);
  });
  const byKind = { sale:'Invoices for outward supply', credit_note:'Credit Note' };
  Object.keys(byKind).forEach(kind=>{
    const groups = {};
    sel.filter(i=>i.kind === kind).forEach(i=>{ const p = String(i.no || '').replace(/\d+$/, ''); (groups[p] = groups[p] || []).push(i); });
    Object.keys(groups).forEach(p=>{ const arr = groups[p].sort((a, b)=>String(a.no) < String(b.no) ? -1 : 1); R.docs.push({ nature:byKind[kind], from:arr[0].no, to:arr[arr.length - 1].no, total:arr.length, cancelled:arr.filter(i=>i.status === 'cancelled').length }); });
  });
  R.b2csList = Object.values(R.b2cs).sort((x, y)=>(x.pos + x.rate) < (y.pos + y.rate) ? -1 : 1);
  return R;
}

/* ---------------------------- GSTR-3B workings ---------------------------- */
function gstr3bBuild_(invs, firm, from, to){
  const z = ()=>({ taxable:0, igst:0, cgst:0, sgst:0 });
  const add = (o, taxable, i, c, s)=>{ o.taxable = round2_(o.taxable + taxable); o.igst = round2_(o.igst + i); o.cgst = round2_(o.cgst + c); o.sgst = round2_(o.sgst + s); };
  const R = { t31a:z(), t31c:z(), t31d:z(), t32:{}, t4a3:z(), t4a5:z(), t4b:z(), t5:{ inter:0, intra:0 }, warnings:[] };
  invs.filter(i=>i.status !== 'cancelled' && inPeriod_(i, from, to)).forEach(inv=>{
    const sign = inv.kind === 'credit_note' ? -1 : 1, reg = gstinValid_(inv.partyGstin);
    const taxedTv = Object.keys(inv.groups || {}).filter(r=>Number(r) > 0).reduce((s, r)=>s + inv.groups[r], 0), nilTv = (inv.groups || {})[0] || 0;
    if(inv.kind === 'sale' || inv.kind === 'credit_note'){
      add(R.t31a, sign * taxedTv, sign * inv.igst, sign * inv.cgst, sign * inv.sgst);
      add(R.t31c, sign * nilTv, 0, 0, 0);
      if(!reg && !inv.intra && taxedTv > 0){ const o = R.t32[inv.pos] || (R.t32[inv.pos] = z()); add(o, sign * taxedTv, sign * inv.igst, 0, 0); }
    } else if(inv.kind === 'purchase'){
      if(inv.reverseCharge) add(R.t31d, taxedTv, inv.igst, inv.cgst, inv.sgst);
      if(inv.reverseCharge && inv.itcEligible !== false) add(R.t4a3, 0, inv.igst, inv.cgst, inv.sgst);
      else if(!inv.reverseCharge && inv.itcEligible !== false) add(R.t4a5, 0, inv.igst, inv.cgst, inv.sgst);
      if(nilTv) R.t5[inv.intra ? 'intra' : 'inter'] = round2_(R.t5[inv.intra ? 'intra' : 'inter'] + nilTv);
    }
  });
  const liab = { igst:round2_(R.t31a.igst + R.t31d.igst), cgst:round2_(R.t31a.cgst + R.t31d.cgst), sgst:round2_(R.t31a.sgst + R.t31d.sgst) };
  const itc = { igst:round2_(R.t4a3.igst + R.t4a5.igst - R.t4b.igst), cgst:round2_(R.t4a3.cgst + R.t4a5.cgst - R.t4b.cgst), sgst:round2_(R.t4a3.sgst + R.t4a5.sgst - R.t4b.sgst) };

  const L = { ...liab }, C = { ...itc }, use = (from, targets)=>{ targets.forEach(t=>{ const u = Math.min(C[from], L[t]); C[from] = round2_(C[from] - u); L[t] = round2_(L[t] - u); }); };
  use('igst', ['igst', 'cgst', 'sgst']); use('cgst', ['cgst', 'igst']); use('sgst', ['sgst', 'igst']);
  R.liability = liab; R.itc = itc; R.payable = L; R.itcCarry = C;
  return R;
}

/* ---------------------------- Composition (CMP-08 / GSTR-4) ---------------------------- */
function compositionBuild_(invs, firm, from, to){
  const rate = Number(firm.compRate) > 0 ? Number(firm.compRate) : 1;
  const R = { rate, turnover:0, cgst:0, sgst:0, tax:0, rcmTaxable:0, rcmTax:0, inwardReg:0, inwardUnreg:0, warnings:[] };
  invs.filter(i=>i.status !== 'cancelled' && inPeriod_(i, from, to)).forEach(inv=>{
    if(inv.kind === 'sale' || inv.kind === 'credit_note'){
      const sign = inv.kind === 'credit_note' ? -1 : 1; R.turnover = round2_(R.turnover + sign * (inv.taxable || 0));
      if(!inv.intra && inv.kind === 'sale') R.warnings.push(`${inv.no}: inter-state sale — a composition dealer cannot make inter-state supplies.`);
    } else if(inv.kind === 'purchase'){
      if(inv.reverseCharge){ R.rcmTaxable = round2_(R.rcmTaxable + inv.taxable); R.rcmTax = round2_(R.rcmTax + inv.cgst + inv.sgst + inv.igst); }
      else if(gstinValid_(inv.partyGstin)) R.inwardReg = round2_(R.inwardReg + inv.taxable); else R.inwardUnreg = round2_(R.inwardUnreg + inv.taxable);
    }

}
function quarterRanges_(fyStartYear){

}

/* ---------------------------- GSTR-2B import + matching ---------------------------- */
function normInv_(s){ return String(s == null ? '' : s).toUpperCase().replace(/[^A-Z0-9]/g, '').replace(/^0+/, ''); }
function num_(v){ const n = parseFloat(String(v == null ? '' : v).replace(/[,₹\s]/g, '')); return isNaN(n) ? 0 : n; }
function toIsoDate_(v){

  const s = String(v).trim(); let m;
  if((m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s))) return m[1] + '-' + m[2] + '-' + m[3];
  if((m = /^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/.exec(s))) return m[3] + '-' + m[2].padStart(2, '0') + '-' + m[1].padStart(2, '0');

  if((m = /^(\d{1,2})[\-\s\/]([A-Za-z]{3})[A-Za-z]*[\-\s\/](\d{2,4})/.exec(s))){ const y = m[3].length === 2 ? '20' + m[3] : m[3]; return y + '-' + (mon[m[2].toLowerCase()] || '01') + '-' + m[1].padStart(2, '0'); }

}
// json = the file downloaded from the GST portal (GSTR-2B JSON). Returns { invoices:[], notes:[] }
function parse2bJson_(json){
  const out = { invoices:[], notes:[] }, d = (json && (json.data && json.data.docdata || json.docdata)) || {};
  const sumItems = it=>{ const s = { taxable:0, igst:0, cgst:0, sgst:0 }; (it || []).forEach(x=>{ s.taxable += num_(x.txval); s.igst += num_(x.igst); s.cgst += num_(x.cgst); s.sgst += num_(x.sgst); }); return s; };
  (d.b2b || []).forEach(s=>(s.inv || []).forEach(i=>{
    const t = (i.items && i.items.length) ? sumItems(i.items) : { taxable:num_(i.txval), igst:num_(i.igst), cgst:num_(i.cgst), sgst:num_(i.sgst) };
    out.invoices.push({ gstin:String(s.ctin || '').toUpperCase(), name:s.trdnm || '', no:i.inum, date:toIsoDate_(i.dt), value:num_(i.val), itcAvl:String(i.itcavl || 'Y').toUpperCase() !== 'N', ...t });
  }));

    const t = (n.items && n.items.length) ? sumItems(n.items) : { taxable:num_(n.txval), igst:num_(n.igst), cgst:num_(n.cgst), sgst:num_(n.sgst) };
    const sg = String(n.typ || n.ntty || 'C').toUpperCase().startsWith('D') ? 1 : -1;
    out.notes.push({ gstin:String(s.ctin || '').toUpperCase(), name:s.trdnm || '', no:n.ntnum, date:toIsoDate_(n.dt), taxable:sg * t.taxable, igst:sg * t.igst, cgst:sg * t.cgst, sgst:sg * t.sgst });

// rows = sheet_to_json(sheet,{header:1}) of the B2B sheet of the portal's Excel (or any sheet with similar column names)
function parse2bRows_(rows){

  for(let i = 0; i < Math.min(rows.length, 15); i++){ const j = (rows[i] || []).map(x=>String(x || '').toLowerCase()).join('|'); if(/gstin/.test(j) && /invoice (number|no)/.test(j)){ h = i; break; } }
  if(h < 0) return out;
  const head = rows[h].map(x=>String(x || '').toLowerCase().replace(/\s+/g, ' ')), find = (...ks)=>head.findIndex(x=>ks.some(k=>x.includes(k)));
  const c = { gstin:find('gstin'), name:find('trade', 'legal', 'name'), no:find('invoice number', 'invoice no'), date:find('invoice date'), value:find('invoice value'), taxable:find('taxable'), igst:find('integrated'), cgst:find('central'), sgst:find('state/ut', 'state tax'), itc:find('itc availability', 'itc avail') };
  for(let i = h + 1; i < rows.length; i++){
    const r = rows[i] || []; const g = String(r[c.gstin] || '').trim().toUpperCase();
    if(!/^\d{2}[A-Z0-9]{13}$/.test(g)) continue;
    out.invoices.push({ gstin:g, name:c.name >= 0 ? r[c.name] : '', no:r[c.no], date:toIsoDate_(r[c.date]), value:c.value >= 0 ? num_(r[c.value]) : 0, taxable:num_(r[c.taxable]), igst:c.igst >= 0 ? num_(r[c.igst]) : 0, cgst:c.cgst >= 0 ? num_(r[c.cgst]) : 0, sgst:c.sgst >= 0 ? num_(r[c.sgst]) : 0, itcAvl:c.itc < 0 || !/^n/i.test(String(r[c.itc] || 'Y')) });
  }
  return out;
}
function reconcile2b_(books, twoB, tolerance){
  tolerance = tolerance == null ? 1 : tolerance;
  const key = x=>(String(x.gstin || x.partyGstin || '').toUpperCase()) + '#' + normInv_(x.no);
  const bmap = {}; books.forEach(b=>{ (bmap[key(b)] = bmap[key(b)] || []).push(b); });
  const used = new Set(), res = { matched:[], mismatch:[], only2b:[], onlyBooks:[] };
  twoB.invoices.forEach(t=>{
    const list = bmap[key(t)]; const b = list && list.find(x=>!used.has(x));
    if(!b){ res.only2b.push(t); return; }
    used.add(b);
    const bt = round2_((b.igst || 0) + (b.cgst || 0) + (b.sgst || 0)), tt = round2_(t.igst + t.cgst + t.sgst);
    const row = { gstin:t.gstin, name:t.name || b.partyName, no:b.no, date2b:t.date, dateBooks:b.date, taxable2b:round2_(t.taxable), taxableBooks:round2_(b.taxable), tax2b:tt, taxBooks:bt, diffTaxable:round2_(b.taxable - t.taxable), diffTax:round2_(bt - tt) };
    (Math.abs(row.diffTaxable) <= tolerance && Math.abs(row.diffTax) <= tolerance ? res.matched : res.mismatch).push(row);
  });
  books.forEach(b=>{ if(!used.has(b)) res.onlyBooks.push(b); });
  const sum = (arr, f)=>round2_(arr.reduce((s, x)=>s + f(x), 0));
  res.itc2b = round2_(sum(twoB.invoices.filter(i=>i.itcAvl), i=>i.igst + i.cgst + i.sgst) + sum(twoB.notes, n=>n.igst + n.cgst + n.sgst));
  res.itcBooks = sum(books, b=>(b.igst || 0) + (b.cgst || 0) + (b.sgst || 0));
  return res;
}

  if(acctInvoices.some(x=>x.id !== d.id && x.kind === d.kind && x.no === d.no && (d.kind !== 'purchase' || (x.partyGstin || '') === (d.partyGstin || '')))) return err(BT_('This number is already used.', 'यह नंबर पहले से इस्तेमाल हो चुका है।'));

// Shrinks the chosen picture so it stays small enough to be saved in the cloud and used on PDFs
function bizPickLogo_(file){
  if(!file) return;
  const rd = new FileReader();
  rd.onerror = ()=>alert('Could not read this image.');
  rd.onload = ()=>{
    const img = new Image();
    img.onerror = ()=>alert('Could not read this image.');
    img.onload = ()=>{
      let max = 256, q = 0.85, out = '';
      for(let n = 0; n < 7; n++){
        const sc = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(img.width * sc)); c.height = Math.max(1, Math.round(img.height * sc));
        const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
        out = c.toDataURL('image/jpeg', q);
        if(out.length <= 30000) break;
        max = Math.round(max * 0.8); q = Math.max(0.6, q - 0.06);
      }
      if(out.length > 38000){ alert('This logo is too detailed. Please choose a simpler / smaller image.'); return; }
      bizDraft_.logo = out; bizDraft_.logoAR = img.height / img.width;
      bizLogoPaint_();
    };
    img.src = rd.result;
  };
  rd.readAsDataURL(file);
}

}

try{ const pj = localStorage.getItem('ssa_plan'); if(pj) bizProfile.plan = JSON.parse(pj); }catch(e){}

/* =====================================================================
   SUBSCRIPTION:  30 days free, then Rs 299 / month (call to subscribe)
   The server decides the dates (businesses.trial_ends_at / paid_until) and
   refuses new data once the plan has ended. This screen only SHOWS it.
   The backend calls bizSetPlan_({ trialEndsAt, paidUntil }) after sign-in.
   No plan from the backend (the old single-business setup) = no limit.
   ===================================================================== */
function bizSetPlan_(plan){
  bizProfile.plan = plan || null;
  try{ if(plan) localStorage.setItem('ssa_plan', JSON.stringify(plan)); else localStorage.removeItem('ssa_plan'); }catch(e){}
}
function planInfo_(){
  const p = bizProfile && bizProfile.plan;
  if(!p) return { mode:'none' };
  const now = Date.now(), paid = p.paidUntil ? new Date(p.paidUntil).getTime() : 0, trial = p.trialEndsAt ? new Date(p.trialEndsAt).getTime() : 0;
  if(paid > now) return { mode:'paid', daysLeft:Math.ceil((paid - now) / 86400000) };
  if(trial > now) return { mode:'trial', daysLeft:Math.ceil((trial - now) / 86400000) };
  return { mode:'expired' };
}
function supportPhoneDigits_(){ return String(SUPPORT_PHONE).replace(/\D/g, ''); }
function supportPhonePretty_(){ const d = supportPhoneDigits_(); return (d.length === 12 && d.startsWith('91')) ? '+91 ' + d.slice(2) : '+' + d; }
function renderPaywall_(main){
  const bn = document.getElementById('bottomNav'); if(bn) bn.style.display = 'none';
  main.className = '';
  const owner = isOwnerUser_() || !isCustomerUser_() && false;
  if(isCustomerUser_()){
    main.innerHTML = `<div class="card" style="max-width:480px;margin:28px auto;text-align:center;"><h2>${escapeHtml(COMPANY_NAME)}</h2><p class="subtle">${BT_('This catalog is temporarily not available. Please contact the shop.','यह कैटलॉग अभी उपलब्ध नहीं है। कृपया दुकान से संपर्क करें।')}</p><button class="btn-pill ghost" onclick="logoutStaff()">${BT_('Switch account','अकाउंट बदलें')}</button></div>`;
    return;
  }
  main.innerHTML = `<div class="card" style="max-width:520px;margin:24px auto;text-align:center;">
    <div style="font-size:44px;">⏳</div>
    <h2>${BT_('Your free trial has ended','आपका फ्री ट्रायल खत्म हो गया')}</h2>
    <p class="subtle" style="margin:6px 0 14px;">${BT_('Subscribe to continue using ' + escapeHtml(COMPANY_NAME) + '. Your data is safe — nothing is deleted.','आगे इस्तेमाल करने के लिए सब्सक्रिप्शन लें। आपका डेटा सुरक्षित है — कुछ भी डिलीट नहीं होता।')}</p>
    <div style="font-size:34px;font-weight:800;">₹${SUBSCRIPTION_PRICE}<span style="font-size:15px;font-weight:600;"> / ${BT_('month','महीना')}</span></div>
    <a class="btn-pill" style="display:block;margin:16px auto 6px;max-width:320px;text-decoration:none;font-size:17px;padding:14px;" href="tel:+${supportPhoneDigits_()}">📞 ${BT_('Call to subscribe','सब्सक्रिप्शन के लिए कॉल करें')}</a>
    <div class="subtle" style="margin-bottom:14px;">${escapeHtml(supportPhonePretty_())}</div>
    <hr style="border:none;border-top:1px solid #e3e8ef;margin:14px 0;">
    <button class="btn-pill alt" onclick="openBackup()">💾 ${BT_('Download my data backup','अपने डेटा का बैकअप लें')}</button>
    <div style="margin-top:10px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;"><button class="btn-pill ghost" onclick="openHelp()">🆘 ${BT_('Help','मदद')}</button><button class="btn-pill ghost" onclick="logoutStaff()">${BT_('Switch account','अकाउंट बदलें')}</button></div>
  </div>`;
}
function planBannerPaint_(main){
  const pi = planInfo_();
  if(!(pi.mode === 'trial' || (pi.mode === 'paid' && pi.daysLeft <= 5)) || !isOwnerUser_()) return;
  const txt = pi.mode === 'trial'
    ? BT_(`🎁 Free trial: <b>${pi.daysLeft}</b> day(s) left. After that ₹${SUBSCRIPTION_PRICE}/month.`, `🎁 फ्री ट्रायल: <b>${pi.daysLeft}</b> दिन बाकी। उसके बाद ₹${SUBSCRIPTION_PRICE}/महीना।`)
    : BT_(`Your subscription ends in <b>${pi.daysLeft}</b> day(s). Call ${escapeHtml(supportPhonePretty_())} to renew.`, `आपका सब्सक्रिप्शन <b>${pi.daysLeft}</b> दिन में खत्म होगा। रिन्यू के लिए ${escapeHtml(supportPhonePretty_())} पर कॉल करें।`);
  main.insertAdjacentHTML('afterbegin', `<div style="background:#fff7e0;border:1px solid #f1d58a;color:#7a5a00;border-radius:10px;padding:9px 12px;margin-bottom:10px;font-size:14px;">${txt}</div>`);
}

if(PUBLIC_MODE){ initPublicCatalog_(); }
else{ applyStaticLanguage();
updateNotifyBtn_();
loadData(); }

// Registers the offline service worker so the app itself (HTML/CSS/JS) can
// load with no internet at all — the data layer above already handles
// working offline and syncing back once a connection returns.
if('serviceWorker' in navigator && !PUBLIC_MODE){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(e=>console.error('Service worker registration failed', e));
  });
  // The moment a newly-deployed service worker takes over (because sw.js
  // was updated and its CACHE_NAME changed), reload once automatically so
  // the page actually shows the new version straight away — instead of
  // everyone needing to refresh three or four times by hand before the new
  // copy finally wins.
  let swRefreshed_ = false;
  navigator.serviceWorker.addEventListener('controllerchange', ()=>{
    if(swRefreshed_) return;
    swRefreshed_ = true;
    window.location.reload();
  });
}
</script>
